[project]
name = "tau-robustness"
version = "0.1.0"
description = "AVER: Agent Verification & Error Recovery — robustness evaluation for tau2-bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tau2",
    "PyYAML>=6.0.2",
    "pydantic>=2.0.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
tau2 = { path = "../../..", editable = true }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "F401", "F541"]

[tool.ruff]
line-length = 88
