[project]
name = "tau2-reliability"
version = "0.1.0"
description = "Comprehensive agent reliability analysis for tau2-bench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tau2",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.2.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=6.0.0",
]

[tool.uv.sources]
tau2 = { path = "../../..", editable = true }

[project.scripts]
tau2-reliability = "tau2_reliability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tau2_reliability"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
