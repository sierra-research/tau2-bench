[project]
name = "tau2-token-cache-benchmark"
version = "0.1.0"
description = "Streaming token-bucket benchmark for local and hosted OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.9",
    "sentencepiece>=0.2",
    "transformers>=4.50,<6",
]

[dependency-groups]
dev = [
    "ruff>=0.9.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F541"]
