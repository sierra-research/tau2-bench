[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tau2-text-coral-seed"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tau2_text_coral_seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
