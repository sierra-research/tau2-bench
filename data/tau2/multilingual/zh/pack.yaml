  - symbol: +
    spoken:
    - 加号
    - 加
  - symbol: '0'
    spoken:
    - 零
    - 洞
  date_examples:
  - written: May 17
    spoken: 5 月 17 日
  - written: '2024-03-05'
    spoken: 2024 年 3 月 5 日
  - written: 05/17
    spoken: 5 月 17 号
  - written: December 1
    spoken: 12 月 1 号
  number_examples:
