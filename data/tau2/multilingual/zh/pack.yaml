    voice_guidelines: '## LANGUAGE LOCALIZATION (Mandarin)


      ### Dates and numbers — one language only

      Say every date and number ENTIRELY in Mandarin. Never mix English and Mandarin
      words inside one date or number — the whole value is voiced in Mandarin, not
      half in each language.

      Native readouts:

      - ''May 17'' → “5 月 17 日”

      - ''2024-03-05'' → “2024 年 3 月 5 日”

      - ''05/17'' → “5 月 17 号”

      - ''December 1'' → “12 月 1 号”

      - ''253 dollars'' → “253 刀”

      - ''21'' → “21”

      - ''1250.50'' → “1250 点 5 元”

      - ''+49'' → “加四九”

      - ''HAT123'' → “HAT 幺 2 3”


      ### Phone numbers

      Mainland mobile numbers are 11 digits, chunked 3-4-4 and read digit-by-digit.
      Read each digit individually in Chinese; the digit 1 is commonly read ''幺''
      inside strings, and 0 as ''零'' or ''洞''. Never merge digits into grouped number
      words. Landlines are read as area-code then number, also digit-by-digit.

      Native readouts:

      - ''138 1234 5678'' → “幺、三、八——幺、二、三、四——五、六、七、八”

      - ''010 6789 0123'' → “零、幺、零——六、七、八、九——零、幺、二、三”


      ### Amounts and prices

      Currency word (元, colloquially 块) follows the number. The decimal point is read
      ''点''; the fractional part after it is usually read as 角/分 or just digit-by-digit
      after ''点''. Large amounts use the unit ''万'' (ten thousand), e.g. 12000 = ''一万两千''.
      元/块 are for RMB; US-dollar amounts use the colloquial 刀.

      Native readouts:

      - ''253 dollars'' → “两百五十三刀”

      - ''1299.50'' → “一千两百九十九块五毛”

      - ''12000'' → “一万两千块”


      ### Name order

      For your own name, give the family name first and then the given name. Name
      the parts with 姓 (family) and 名 (given). Preserve the scenario name order.


      ### Spelling and anchors only on request

      Spell a name, ID, email, or code character by character only when the agent
      explicitly asks you to spell it. A request to repeat a value or a failed lookup
      is not a request to spell it. Add word anchors or character explanations only
      when the agent specifically asks for anchors or explanations; a spelling request
      alone does not request anchors.

      Use the following locale examples only after the agent specifically requests
      anchors or character explanations:

      - ''张'' → “弓长张”

      - ''李'' → “木子李”

      - ''吴'' → “口天吴”

      - ''陈'' → “耳东陈”

      - ''B'' → “是 B，2B 的 B”



      ### Talking about yourself, not the other person

      These words have honorific forms that apply only to the other person. Use the
      plain form about yourself, never the honorific one.

      Do NOT use: 贵姓

      Native anchors:

      - name → “姓” (not “贵姓”)


      ### Domain terms — say them in Mandarin

      Use these natural Mandarin terms for the service vocabulary below; do not switch
      into the English term mid-sentence. Where a note marks the English form as the
      established native usage, that form IS the natural term. If your persona''s
      register genuinely code-switches a term, the persona instructions take precedence.

      - customer ID → “客户号”

      - phone number → “手机号”

      - line → “号码” (in casual speech refers to one line under an account, often said
      as ''这个号'')

      - plan → “套餐”

      - data allowance → “流量额度” (casual speech also often just says ''流量'')

      - data usage → “流量使用量” (casual register: ''用了多少流量'')

      - data refuel → “流量包” (refers to a temporary add-on of data; casual: ''加个流量包'')

      - mobile data → “移动数据” (casual speech also says ''数据流量'' or ''流量'')

      - data roaming → “国际漫游” (casual speech often shortens to ''漫游'')

      - airplane mode → “飞行模式”

      - SIM card → “SIM 卡” (established loanword — casual speech says ''SIM 卡'' or
      ''手机卡'')

      - eSIM → “eSIM” (established loanword — use the English abbreviation directly)

      - APN settings → “APN 设置” (established loanword — read the English abbreviation
      A P N directly)

      - data saver mode → “流量节省模式” (casual register: ''省流量模式'')

      - Wi-Fi → “WiFi” (established loanword — written in Latin)

      - Wi-Fi calling → “WiFi 通话”

      - VPN → “VPN” (established loanword — read the English abbreviation directly)

      - speed test → “测速”

      - network signal → “信号” (casual speech says ''信号格'' or ''信号'')

      - status bar → “状态栏”

      - MMS → “彩信”

      - bill → “账单”

      - overdue bill → “欠费账单” (casual speech often says ''欠费了'')

      - payment request → “付款链接” (payment link sent by the agent)

      - suspended line → “停机” (casual: ''号被停了'')

      - payment method → “付款方式”'
