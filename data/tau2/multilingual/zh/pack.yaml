  phone_number_readout:
    rule: Mainland mobile numbers are 11 digits, chunked 3-4-4 and read digit-by-digit.
      Read each digit individually in Chinese; the digit 1 is commonly read '幺' (yao)
      inside strings, and 0 as '零' or '洞'. Never merge digits into grouped number
      words. Landlines are read as area-code then number, also digit-by-digit.
    examples:
    - written: 138 1234 5678
      spoken: 幺、三、八——幺、二、三、四——五、六、七、八
    - written: 010 6789 0123
      spoken: 零、幺、零——六、七、八、九——零、幺、二、三
  amount_readout:
    rule: Currency word (元, colloquially 块) follows the number. The decimal point
      is read '点'; the fractional part after it is usually read as 角/分 or just digit-by-digit
      after '点'. Large amounts use the unit '万' (ten thousand), e.g. 12000 = '一万两千'.
      元/块 are for RMB; US-dollar amounts use the colloquial 刀.
    examples:
    - written: 253 dollars
      spoken: 两百五十三刀
    - written: '1299.50'
      spoken: 一千两百九十九块五毛
    - written: '12000'
      spoken: 一万两千块
  spelling_alphabet:
    # The benchmark's caller names are ROMANIZED pinyin held in the agent's
    # records (e.g. 'Liu Feng'), said family name first — the order the record
    # now stores. So the name case is a pinyin case: give the family name
    # first, spell it in Latin letters, and name the two parts with 姓/名 when
    # the agent needs to know which is which. Character decomposition stays
    # below for a name genuinely written in 汉字.
    rule: For a caller's own name, say the family name first and then the given
      name, and spell each in Latin letters when the agent mishears ('我姓 Liu，
      L、I、U；名 Feng，F、E、N、G'). Name the parts with 姓 (family) and 名 (given)
      rather than translating 'first/last name' literally. For a name written in
      Chinese characters, disambiguate by decomposing the character into its parts
      or naming a well-known word that contains it — the standard phone convention
      (e.g. '弓长张' for 张, '木子李' for 李, '口天吴' for 吴, '伟大的伟' for 伟). For a Latin letter
      in a code, just repeat the letter name clearly and optionally anchor it to an
      English word.
    avoid: The NATO/anglo phonetic alphabet ('A for Alpha', 'B for Bravo') is NOT
      used for Chinese characters. Do NOT give a romanized name given-name-first
      ('Feng Liu') — that is the English order, not how the name is said or stored.
    anchor_examples:
    - written: 张
      spoken: 弓长张
    - written: 李
      spoken: 木子李
    - written: 吴
      spoken: 口天吴
    - written: 陈
      spoken: 耳东陈
    - written: B
      spoken: 是 B，2B 的 B
  # 贵姓 is the honorific 'surname' used only when ASKING someone else (您贵姓?);
  # about oneself it is 我姓… / 我的姓. Added off the same trap measured in Korean
  # (성함 self-applied in 71/300 ko sims); zh has not been counted independently.
  # PENDING NATIVE REVIEW: the pair.
  honorific_self_reference:
  - concept_id: name
    honorific: 贵姓
    plain: 姓
