translation_guidance: 'Target register: natural Mainland spoken Putonghua in Simplified
  characters. Two register poles coexist in this pack: a formal, complete-sentence
  northern standard (Jianguo, uses 您) and a fast casual southern-accented Chinese-English
  mix (Xiaomeng, uses 你). Match the persona''s register; do NOT flatten everything
  into stiff written/literary Chinese. Avoid Taiwan-specific vocabulary and never
  emit Traditional characters.


  LOANWORD / CODE-SWITCHING POLICY:

  - For the casual urban-professional register, English tech and lifestyle words are
  the INTENDED register and must be written in Latin script inline: OK, deadline,
  App, case, PPT, WiFi, KTV, email, update, cancel, confirm. Do NOT ''purify''
  these into formal Chinese when the casual register is intended (e.g. don''t force
  ''App'' to 应用程序 when the speaker would say the English). English VERBS are not
  inserted this way on the Mainland — the verb stays Chinese (跟进, not ''follow up'').
  A loanword noun that matches this register is never a defect.

  - Chinese stays the matrix language: connectives, verbs, grammar, and sentence-final
  particles (啊/吧/呀/啦/嘛) are in Chinese; English words are insertions.

  - The formal register (您-speaker) carries almost NO English — keep his lines in
  clean Chinese, with at most a brand name or unit in Latin.


  CALQUE TRAPS (translate the MEANING, not the words):

  - ''if and only if'' must NOT become a literal string. Use natural phrasing: ''只有在……的情况下才……''
  or ''当且仅当'' only for genuinely technical/legal text.

  - ''as soon as possible'' -> ''尽快'' / ''越快越好'', not a word-for-word rendering.

  - ''make sure that'' -> ''记得……'' / ''一定要确认……'' / ''确保……'', choosing register; don''t
  reflexively write a stiff ''务必确保'' for a casual speaker.

  - ''let me know'' -> ''到时候跟我说一声'' / ''告诉我一下'', not ''让我知道''.

  - ''I''m afraid not'' (polite refusal) -> ''恐怕不太方便'' / ''可能不行'', not a literal ''我害怕''.

  - Conditionals: keep trigger and consequence aligned; ''如果……就……'' / ''要是……的话就……''
  must map the English if/then exactly (don''t drop the 就 consequence).


  GENDER:

  - Mandarin does NOT inflect verbs or adjectives for the speaker''s gender — first-person
  我 and second-person 你/您 are gender-neutral, so there is no gendered-verb default
  to manage. Write the prose neutrally; the speaker''s actual gender is injected at
  runtime via the voice persona. Using the gender-neutral form is CORRECT and intended
  and is never a meaning or register defect.

  - The only place gender surfaces is the written third-person pronoun (他/她/它), all
  pronounced ''tā''. When the referent''s gender is unknown or unmarked, default to
  他; using it is never a meaning difference. The only defect is INCONSISTENCY — switching
  他/她 for the same known referent within one text.


  SCRIPT / NUMBER CONVENTIONS:

  - All concrete values — ids, codes, amounts, dates, phone/flight/reservation numbers
  — stay verbatim with Latin/Arabic digits (1, 2, 3), never Chinese numeral characters
  (一, 二, 三) for those. The VALUE is verbatim; an attached unit/word localizes (e.g.
  ''3h'' -> ''3 小时''; keep the digit, translate the unit).

  - When prose spells out a phone number or code digit-by-digit in narration, reflect
  the convention that ''1'' is read 幺 (yao) and digits are separated, but the stored
  value stays as plain digits.

  - Dates render year-month-day: ''2024年3月5日''. Currency in 元/块. Decimal point is
  点. Email ''@'' may be read ''艾特''/at and ''.'' read 点, but the literal address string
  stays verbatim Latin.

  - Common everyday units and brand names (WiFi, App, PPT, KTV, OK) stay in Latin.


  REGISTER EXAMPLES (natural targets):

  - Casual (Xiaomeng): ''这个 case 还没跟进，你直接发我 App 上就好啦。''

  - Casual refusal: ''嗯……这个可能不行诶，我再看看吧。''

  - Formal (Jianguo): ''不好意思，麻烦您帮我核对一下，我再跟您确认一遍。''

  - Conditional: ''如果客服那边拒绝的话，您就先别坚持了。'''
agent_greeting: 您好！请问有什么可以帮您？
