# --- nativeness scoring ---
# judge_factors select from the closed catalog in tau2.multilingual.nativeness_catalog;
# factor_id must exist there (the loader rejects unknown ids). email_symbols
# are native verbalizations of email symbols for the deterministic checker.
nativeness:
  judge_factors:
  - factor_id: register_formality
    enabled: false
    nuance: Formal customer address with 您
    question: Did the agent address the customer with 您 rather than 你?
    native_does: Uses 您 for customer address. Omitting the pronoun is fine when
      Mandarin does not need it, and colloquial 你 inside light-verb phrases such as
      帮你 or 麻烦你 in an otherwise-您 call is unmarked natural service speech, not
      a violation.
    ai_likely_does: Addresses the customer with 你-family forms throughout and never
      reaches for 您 anywhere in the call. Mixed 您/你 usage is acceptable. Quoted
      customer wording does not count. Judge request wording under request
      politeness, not here.
  - factor_id: regional_consistency
    enabled: false
    nuance: Mainland Mandarin vocabulary
    question: Across the call, did the agent consistently use natural Mainland Mandarin
      vocabulary?
    native_does: Uses ordinary Mainland service words such as 手机, 软件 or App, 身份证,
      订单, 退票, 改签, and 退款. A widely understood regional word, a quotation, or
      mirroring the customer once is fine.
    ai_likely_does: Repeatedly mixes distinctly Taiwan or Hong Kong vocabulary such as
      行動電話 or 軟體 into otherwise Mainland wording without a reason. Judge vocabulary
      only; accent, pronunciation, and written-form differences such as 身分證 versus
      身份证 or Simplified versus Traditional script are not violations in a voice
      transcript.
  # Colloquial Mandarin accepts 张 with 预订/订单/行程 and default 个 with
  # abstract nouns (几个关键信息 is standard); only incompatible pairings count.
  - factor_id: counting_units
    nuance: Natural numbers and measure words
    question: When the agent counted something, did it use a natural measure word and
      the natural form of two?
    native_does: Says 两张票 and 两个订单 for counted quantities. Uses 二 naturally in
      ordinals and fixed strings, such as 第二个 and 二零二五年. Both 二百 and 两百 are
      fine. Common broad measure words are also fine, such as 几个问题.
    ai_likely_does: Says an incompatible combination such as 一位字母, or says 二个订单
      or 二张票 where a native speaker would say 两个订单 or 两张票. Do not flag 二百
      or 两百, and do not flag measure-word pairings natives accept in fast speech,
      such as 这张行程 when the ticket is meant.
  # This is an omission factor: persistently flat, particle-free textbook tone
  # is evaluated at conversation level.
  - factor_id: modal_particles
    nuance: Natural sentence-final particles
    question: Across a substantial call, did the agent use sentence-final particles in
      a natural conversational way?
    native_does: Uses particles such as 吗, 呢, 吧, and 啊 where they naturally soften a
      question, confirmation, or suggestion, for example 这样可以吗 or 您稍等一下吧.
      Not every sentence needs a particle.
    ai_likely_does: Sounds persistently like flat written Chinese because it misses clear
      opportunities for particles across the call, or adds the same particle to nearly
      every sentence mechanically. Do not flag one plain sentence.
  - factor_id: natural_word_choice
    nuance: Combined utterance naturalness for Mainland Mandarin
    question: >-
      This is one agent utterance from a customer-service call in Mainland Mandarin.
      Does it contain English-shaped translationese or clearly unnatural word choice?
    native_does: >-
      Pass natural spoken Mainland Mandarin, including ordinary service formality,
      colloquial phrasing, and established borrowings or code-switching that sound
      natural. Names, identifiers, codes, and product names may remain as given. An
      English interface, setting, or status label passes when the context establishes
      that it is the actual displayed label or it is naturally mirrored from the
      customer; do not assume that every generic English technical phrase is such a
      label. Ignore harmless transcription spacing or punctuation. Judge language use
      only, not listening accuracy, facts, policy compliance, or task success.
    ai_likely_does: >-
      Inspect every complete clause and phrase independently. A clearly unnatural
      local collocation or selectional mismatch is a violation even when the rest of
      the utterance is fluent. Flag wording that would sound clearly odd to a Mainland
      Mandarin speaker because it follows English structure or idiom word for word;
      uses forced nominal or passive phrasing, unnatural pronouns, connectors, or
      aspect particles; uses an unnatural word choice, collocation, or literal
      coinage; inserts unnecessary English, especially a cluster of generic settings,
      permissions, or statuses where ordinary Chinese is expected; or exposes raw
      backend or system language as customer-facing speech. One clear instance is
      enough. Do not flag mere formality, a smoother alternative, or wording that is
      only slightly awkward. For interrupted turns, judge complete material before
      the cutoff and ignore only the clipped ending.
  # Added from the 2026-08-13 audit review: the R2 "Request softeners 麻烦/帮我/可以…吗"
  # row was confirmed (sev 2), and register_formality explicitly routes
  # softeners away with nowhere to send them until now. Anchors are the
  # confirmed row's phrases only. Flip to live after the cold-eval pass.
  - factor_id: request_politeness
    enabled: false
    nuance: Natural service-call requests
    question: When the agent asked the customer to do something, did it phrase the
      request naturally and politely?
    native_does: Uses forms such as 麻烦您帮我确认一下, 请问您方便提供号码吗, or
      能不能再说一遍. A short direct instruction can be natural when urgency or context
      calls for it; not every request needs an extra softener.
    ai_likely_does: Repeatedly gives bare commands such as 给我号码, 等着, or 再说
      without a reason. A single curt line also counts when it lands as impatient -
      a bare re-ask after the agent's own mistake (请再拼一遍 alone, with no
      acknowledgment or apology), or a hasty admonition such as 先说清楚一点. Friendly
      colloquial closers such as 您忙您的吧 are acceptable, not brusque. Judge 您
      versus 你 under address register and sentence-final particles under natural
      sentence-final particles.
  - factor_id: name_address_conventions
    nuance: Chinese name order and title attachment
    question: When the agent used the customer's name, did it keep Chinese name
      order and attach 先生 or 女士 naturally?
    native_does: Keeps the family name first and attaches the title to the surname
      or the full name. Examples are 王先生, 李女士, and 王明先生. Addressing the
      customer as 您 without a name is also natural. If the agent never uses the
      customer's name, there is no opportunity.
    ai_likely_does: Reverses the known localized name into Western order, such as
      明王 for 王明; attaches the title to the given name alone, such as 明先生;
      or keeps addressing the customer by the bare given name, such as
      明，请确认. Romanized forms are different - Western order is the normal
      way to romanize a Chinese name, so saying 周浩然先生 and later spelling
      the name out as Haoran Zhou is acceptable. The violation is rendering
      different people's names in different orders within the same call.
      小姐 and 女士 are both acceptable titles. Do not require name use, infer a
      Chinese name from a foreign or source name, or flag quoted reports or
      third-party names. Judge 您 versus 你 under address register.
  enabled_deterministic_factors:
  - email_symbol_verbalization
  email_symbols:
    '@':
    - 艾特
    - at
    .:
    - 点
    - dot

# --- delivery scoring (audio-layer) ---
# judge_factors select from the closed catalog in tau2.multilingual.delivery_catalog;
# factor_id must exist there (the loader rejects unknown ids). Rubrics are grounded
# in confirmed human-annotation findings (docs/multilingual/annotation/nuance_map.json).
delivery:
  judge_factors:
  # R2b-confirmed "买 mǎi vs 卖 mài (buy vs sell)" (sev 3): a wrong tone flips
  # the transaction meaning.
  - factor_id: tone_meaning_flip
    listen_for: Lexical tone errors that flip a word's meaning — the confirmed
      case is 买 mǎi (buy) realized as 卖 mài (sell); listen for tones on
      meaning-bearing words that turn them into different words.
  - factor_id: regional_accent_consistency
    listen_for: Pronunciation that repeatedly conflicts with Mainland standard
      Putonghua or audibly switches between incompatible systems within the
      call — sustained Taiwan- or Hong Kong-accented Mandarin, a heavy regional
      accent, or an English-accented rendering of Chinese words. Accept
      ordinary speaker variation; judge accent only — a tone error that turns a
      word into a different word belongs to the tone-meaning criterion.

