# Per-character clarification glosses — the closed catalog the native-script
# spell-out payload draws from (one gloss per character of the full name;
# see tau2.multilingual.native_script.han_spellout). Surnames use the 标准
# phone conventions where one exists (弓长张, 木子李, 三横王, 口天吴, 双人徐,
# 耳东陈, ...); given-name characters use a well-known containing word
# ("X的X"). Every character of every native name form above must be covered
# (the corpus validator enforces it).
# CURATED CONTENT — flag any change for native-speaker review.
