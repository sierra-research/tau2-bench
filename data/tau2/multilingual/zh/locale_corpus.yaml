# --- Native-script DB ablation (romanization x localization 2x2) ---------
# Hanzi forms of every pool name, keyed by the romanized (pinyin) pool entry.
# Consumed ONLY by `tau2 factory localize-entities --native-script`; the
# ordinary `_identity` build keeps the romanized names above. The same
# romanization maps to DIFFERENT characters per role on purpose (surname
# Yang 杨 vs given-name Yang 阳), which is why the tables are per pool.
# CURATED CONTENT — flag any change for native-speaker review.
