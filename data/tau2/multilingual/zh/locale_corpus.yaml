# Locale identity corpus for zh (Mainland China, Mandarin/Putonghua) —
# reviewed raw material for the `tau2 factory localize-entities` step. The
# name POOLS are romanized (Hanyu Pinyin without tone marks — the model's
# validator rejects native-script pool names); the native_* tables below map
# each pool entry to its Hanzi form for the native-script DB ablation. The
# generator draws deterministically per caller (seeded by the original
# user_id, gender inherited from the English caller's given name) and
# preserves the numeric suffix for user_id uniqueness.
country: CHN
phone_number_format: "138 #### ####"
email_domain: example.com
zip_format: "######"
address_format:
  city_region: "{region} {city}"
  city_country: "{country} {region} {city}"
  full_address: "{region} {city}, {address1}, {address2}, {postcode}"
address_review:
  source: "reviewed localization corpus (updated 2026-08-03)"
  status: annotator_feedback_applied

