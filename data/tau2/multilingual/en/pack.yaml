    tags:
      code_switch: none
      formality: medium
      english_tolerance: high
      age_band: 40s
      register: urban_professional
      closing_style: brisk
      gender: female
translation_guidance: 'Target register: natural spoken Standard American English (General
  American), US locale. This is the REFERENCE BASELINE pack — both personas are native
  US English with NO code-switching and NO non-native accent. There is no matrix/insertion
  split: everything is English in Latin script.


  LOANWORD / CODE-SWITCHING POLICY:

  - None. Do NOT insert foreign-language words, honorifics, or borrowed politeness
  markers. Keep ordinary domain vocabulary (booking, refund, account, confirmation
  number, hold, supervisor) as plain English. Contractions are the natural register
  and should be used freely (''I''m'', ''don''t'', ''that''s'', ''gonna'' for Matt''s
  casual lines); avoid stiff fully-spelled-out forms unless emphasis genuinely calls
  for it.


  CALQUE TRAPS (translate the MEANING, idiomatic English, not stilted literalism):

  - ''if and only if'' -> in spoken English just ''only if'' / ''only when'', e.g.
  ''I''ll do that only if there''s no other option'' — don''t render a logician''s
  phrasing in dialogue.

  - ''as soon as possible'' -> ''as soon as you can'' / ''right away'' in speech;
  ''ASAP'' is fine in clipped impatient register (Lisa).

  - ''make sure that'' -> ''make sure'', ''double-check that'' — not the formal ''ensure
  that'' unless the agent is being formal.

  - Conditionals: keep the same trigger and consequence; ''if ... then ...'' maps
  directly. In casual speech the explicit ''then'' is often dropped (''If the agent
  refuses, don''t push it.'') — that is natural and correct.


  GENDER:

  - English does NOT inflect verbs or adjectives for the speaker''s gender. There
  is no gendered-verb agreement to manage and no unmarked-masculine default to worry
  about. Write task prose gender-neutrally; the speaker''s actual gender is carried
  only by the voice persona at runtime. A sentence like ''I want to cancel my booking''
  is identical regardless of speaker gender — never flag this as a gender defect.


  SCRIPT / NUMBER CONVENTIONS:

  - All prose is Latin script with Latin digits (1, 2, 3). All concrete values — ids,
  confirmation/booking codes, amounts, dates, phone numbers — stay verbatim; the VALUE
  is verbatim, an attached unit/word stays English (''3h'' -> ''3 hours'', keep the
  digit).

  - Read-aloud norms for TTS-facing text: digits in a string are read one at a time,
  with ''0'' usually ''oh'' (''555-0142'' -> ''five five five, oh one four two'');
  booking codes mix letters (by name, e.g. ''B as in boy'') and digits read individually
  (''B-7-K-2''). Currency in USD (''$19.99'' -> ''nineteen ninety-nine''); decimals
  with ''point'' (''3.5'' -> ''three point five''); years as pairs where natural (''1998''
  -> ''nineteen ninety-eight''); times 12-hour with am/pm; dates month-day-year. Email:
  ''@'' -> ''at'', ''.'' -> ''dot'', ''.com'' -> ''dot com'', ''_'' -> ''underscore'',
  ''-'' -> ''dash''.


  REGISTER EXAMPLES (natural target):

  - Calm/cooperative (Matt): ''Yeah, no problem, take your time — let me see here.''

  - Impatient/sarcastic (Lisa): ''Oh, great. So like I already said twice, the order''s
  wrong. Can someone actually fix it?''

  - Spelling a code: ''B as in boy, seven, K as in kite, two.'''
