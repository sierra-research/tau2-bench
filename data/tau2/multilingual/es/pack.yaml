translation_guidance: 'Target register: natural spoken Spanish. The pack spans two
  registers within Peninsular Spanish — high-register Peninsular (Alejandro: distinción,
  ''usted'', minimal English) and casual Peninsular (Camila: tuteo, distinción, heavy
  English code-switching). Do NOT flatten everything into neutral/textbook Spanish;
  match the persona register where the persona is known, and otherwise default to
  natural neutral spoken Spanish.


  LOANWORD / CODE-SWITCHING POLICY:

  - For the casual Peninsular register, English loanwords for work, tech, money and
  everyday terms are the INTENDED register and stay in Latin script inline: brief,
  deadline, update, email, file, link, status, online, mail. Do NOT ''purify'' these
  into stiff Spanish when the casual register is intended (e.g. don''t force ''el
  deadline'' into ''la fecha límite'' in Camila''s voice).

  - For the formal Peninsular register, prefer proper Spanish terms: ''correo electrónico''
  (not ''email''), ''contraseña'' (not ''password''), ''transferencia'', ''cancelar''.
  A loanword that matches the persona''s register is never a defect; the defect is
  using the WRONG register for the persona.

  - Spanish stays the matrix language (connectives, verbs, grammar); English words
  are insertions.


  CALQUE TRAPS (translate the MEANING, not the words):

  - ''if and only if'' must NOT become the literal ''si y sólo si'' in conversational
  prose — use ''solo si...'' / ''únicamente cuando...'' / ''solamente en caso de que...''.

  - ''as soon as possible'' -> ''lo antes posible'' / ''cuanto antes'', never a word-for-word
  string.

  - ''make sure that'' -> ''asegúrate de que'' / ''asegúrese de que'' / ''que no se
  te olvide que'', NOT ''haz seguro que''.

  - ''I look forward to...'' has no literal calque — render as ''quedo a la espera
  de...'' (formal) or just ''venga, ya me dices'' (casual).

  - ''actually'' as a discourse marker -> ''en realidad'' / ''la verdad'' (NOT ''actualmente'',
  which means ''currently'' — classic false friend).

  - ''to apply'' (for something) -> ''solicitar'', NOT ''aplicar'' (in Peninsular
  formal); ''aplicar a'' is not natural in Peninsular, so avoid it even for Camila.

  - Conditionals: keep the same trigger and consequence; ''si ... entonces ...'' must
  map the English if/then exactly — never drop the consequence, and use natural Spanish
  ''si + present, ... future/imperative''.


  GENDER:

  - Spanish inflects adjectives and participles for the speaker''s/referent''s gender.
  When the speaker''s gender is unknown in the task prose, the unmarked/DEFAULT is
  masculine (e.g. ''estoy seguro'', ''quedo agradecido''). Write the prose in this
  default; do NOT bake a specific gender into the task prose. The speaker''s actual
  gender is injected at runtime via the voice persona.

  - The unmarked/default masculine form is CORRECT and intended: it is never a meaning,
  naturalness or register problem, and forced agreement using it is never a meaning
  difference. The only gender defect is INCONSISTENCY within one text — e.g. one clause
  ''estoy seguro'' and the next ''estoy segura'' for the same speaker.

  - Watch tú/usted consistency: do not mix ''usted'' and ''tú'' forms for the same
  addressee within one passage unless the persona is explicitly slipping.


  SCRIPT / NUMBER CONVENTIONS:

  - Script is Latin throughout. All concrete values — ids, booking codes, amounts,
  dates, reservation numbers — stay verbatim with Latin digits (1, 2, 3). The VALUE
  is verbatim; an attached unit/word localizes (e.g. ''3h'' -> ''3 horas'', keep the
  digit, translate the unit).

  - Spanish uses a DECIMAL COMMA and a THOUSANDS POINT (1.250,75). Currency for this
  Spain-targeted pack is euros (€), written after the amount: ''1.250,75 €''. When
  read aloud, quantities and prices are spoken in full words (''mil doscientos cincuenta
  euros''), not digit by digit.

  - Booking codes and letters: spelled with Spanish letter names (a, be, ce, de, e,
  efe, ge, hache, i, jota, ka, ele, eme, ene, eñe, o, pe, cu, erre, ese, te, u, uve,
  equis, i griega/ye, zeta) and optional city anchors (''B de Barcelona'', ''C de
  Córdoba'').

  - Email/symbols read aloud: ''@'' = ''arroba'', ''.'' = ''punto'', ''-'' = ''guion'',
  ''_'' = ''guion bajo'' (e.g. ''juan arroba correo punto e ese'').


  REGISTER EXAMPLES (natural target):

  - Formal Peninsular: ''Buenas tardes, quisiera consultar el estado de una transferencia,
  por favor.'' / ''Perdone, ¿sería tan amable de repetírmelo más despacio?''

  - Casual Peninsular: ''Hola, oye, mira, necesito que me echéis una mano con un pago
  que me han cancelado.'' / ''Venga, mándame el update por mail y listo.''

  - Conditional mapping: ''Si el agente se niega, entonces no insistas.'''
