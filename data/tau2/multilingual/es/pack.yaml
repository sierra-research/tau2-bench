domains:
  airline:
    regional_bundle_file: regional/airline.json
    revision: voice-v2-frozen50-v1
    task_metadata_file: airline_metadata_es.json
    voice_guidelines: '## LANGUAGE LOCALIZATION (Spanish)


      ### Dates and numbers — one language only

      Say every date and number ENTIRELY in Spanish. Never mix English and Spanish
      words inside one date or number — the whole value is voiced in Spanish, not
      half in each language.

      Native readouts:

      - ''May 17'' → “diecisiete de mayo”

      - ''05/17'' → “diecisiete del cinco”

      - ''December 3'' → “tres de diciembre”

      - ''2024-11-21'' → “veintiuno de noviembre de dos mil veinticuatro”

      - ''253 dollars'' → “doscientos cincuenta y tres dólares”

      - ''21'' → “veintiuno”

      - ''1.250,75 €'' → “mil doscientos cincuenta euros con setenta y cinco céntimos”

      - ''+49'' → “más cuarenta y nueve”


      ### Phone numbers

      Spanish speakers group phone numbers in short blocks (Spain mobile: 3-2-2-2,
      e.g. 612 34 56 78; Spain landline: 2-3-2-2, e.g. 91 234 56 78) and read them
      digit by digit within each block. Grouping digits into two-digit numbers (sesenta
      y uno...) is acceptable but when unsure a native falls back to strict digit-by-digit
      for clarity. An initial ''+'' is read ''más'' followed by the country-code digits.

      Native readouts:

      - ''612 34 56 78'' → “seis, uno, dos... tres, cuatro... cinco, seis... siete,
      ocho”

      - ''91 234 56 78'' → “nueve, uno... dos, tres, cuatro... cinco, seis... siete,
      ocho”

      - ''+34 655 40 12 90'' → “más, tres, cuatro... seis, cinco, cinco... cuatro,
      cero... uno, dos... nueve, cero”


      ### Amounts and prices

      The currency word goes AFTER the amount, spoken in full words (never digit by
      digit). The decimal separator is the comma, spoken ''con'' before the cents
      (or ''coma'' when reading a bare decimal number). Large amounts use ''mil''
      and ''millón/millones''.

      Native readouts:

      - ''253 €'' → “doscientos cincuenta y tres euros”

      - ''35,50 €'' → “treinta y cinco euros con cincuenta”

      - ''1.250,75 €'' → “mil doscientos cincuenta euros con setenta y cinco”

      - ''12.000 €'' → “doce mil euros”


      ### Spelling and anchors only on request

      Spell a name, ID, email, or code character by character only when the agent
      explicitly asks you to spell it. A request to repeat a value or a failed lookup
      is not a request to spell it. Add word anchors or character explanations only
      when the agent specifically asks for anchors or explanations; a spelling request
      alone does not request anchors.

      Use the following locale examples only after the agent specifically requests
      anchors or character explanations:

      - ''B'' → “B de Barcelona”

      - ''M'' → “M de Madrid”

      - ''A'' → “A de Antonio”

      - ''V'' → “uve de Valencia”

      - ''E'' → “E de España”



      ### Domain terms — say them in Spanish

      Use these natural Spanish terms for the service vocabulary below; do not switch
      into the English term mid-sentence. Where a note marks the English form as the
      established native usage, that form IS the natural term. If your persona''s
      register genuinely code-switches a term, the persona instructions take precedence.

      - user ID → “ID de usuario” (airline user id is an alphanumeric handle (e.g.
      ''mia_li_3668''), not numeric; avoid ''número'' which implies digits only)

      - reservation → “reserva”

      - reservation ID → “localizador” (''localizador'' is the usual term; also ''código
      de reserva'')

      - flight → “vuelo”

      - flight number → “número de vuelo”

      - refund → “reembolso” (in casual register also ''el refund'')

      - travel insurance → “seguro de viaje”

      - checked bag → “maleta facturada” (also ''equipaje facturado'')

      - carry-on bag → “equipaje de mano”

      - future trip → “viaje futuro” (also ''un viaje que tengo pendiente'')

      - one-way trip → “viaje de ida”

      - round trip → “viaje de ida y vuelta”

      - basic economy → “clase turista básica” (also ''la tarifa básica'')

      - economy → “clase turista”

      - business class → “clase business” (''business'' is an established English
      loanword, the usual term; also ''clase preferente'')

      - credit card → “tarjeta de crédito”

      - gift card → “tarjeta regalo” (''tarjeta regalo'' dominates in Spain; the English
      ''gift card'' is not the usual spoken form)

      - travel certificate → “bono de viaje” (also ''vale de viaje'')

      - membership tier → “nivel de socio” (regular / plata / oro; also ''nivel de
      fidelidad'')

      - cancellation → “cancelación”

      - payment method → “forma de pago” (also ''método de pago'')'
