      - order → “pedido”

      - order ID → “número de pedido” (literally ''order number''; the natural everyday
      term.)

      - order status → “estado del pedido”

      - pending order → “pedido pendiente”

      - delivered order → “pedido entregado”

      - cancellation → “cancelación”

      - return → “devolución”

      - exchange → “cambio”

      - refund → “reembolso” (casual register commonly code-switches to the loanword
      ''el refund''.)

      - product → “producto”

      - item → “artículo”

      - option → “opción” (when specifying, natives say ''color'', ''talla'' or ''material''.)

      - item ID → “número de artículo”

      - product ID → “número de producto”

      - availability → “disponibilidad”

      - price difference → “diferencia de precio”

      - tracking number → “número de seguimiento” (casual register often uses the
      loanword ''el tracking''.)

      - shipping address → “dirección de envío”

      - default address → “dirección predeterminada” (also ''la dirección por defecto''
      in everyday usage.)

      - payment method → “método de pago”

      - credit card → “tarjeta de crédito”

      - gift card → “tarjeta regalo” (casual register also says the loanword ''la
      gift card''.)

      - PayPal account → “PayPal” (brand name)

      - human agent → “agente humano” (also ''una persona'' / ''un operador de verdad''
      in everyday language.)'
