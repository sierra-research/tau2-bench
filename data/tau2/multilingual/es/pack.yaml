# --- nativeness scoring ---
# judge_factors select from the closed catalog in tau2.multilingual.nativeness_catalog;
# factor_id must exist there (the loader rejects unknown ids). email_symbols
# are native verbalizations of email symbols for the deterministic checker.
nativeness:
  judge_factors:
  - factor_id: register_formality
    enabled: false
    nuance: Formal address (usted vs tú)
    question: Did the agent use usted or tú appropriately and keep that choice
      consistent throughout the call?
    native_does: Uses one natural form of address and its matching grammar. Examples
      are "¿Me puede dar su número de reserva?" with usted and "¿Me puedes dar tu
      número de reserva?" with tú. A change is fine when the customer clearly invites
      a more familiar or more formal register.
    ai_likely_does: Switches between usted and tú for the same customer without a
      reason, or mixes their grammar. Examples are "¿Me puede dar tu número?" and
      moving from "usted" to "tú" halfway through the call. Judge the form of address
      here; other gender or verb errors belong to their own criteria.
  - factor_id: gender_agreement
    enabled: false
    nuance: Gender agreement
    question: Did gendered words agree with each other and with the known gender of
      the agent or customer?
    native_does: Catch three subtypes of agreement. (1) Agent self-reference — a
      known female agent uses feminine forms for herself, such as "estoy lista" or
      "encantada de ayudar". In a greeting or any utterance before the speakers'
      identities are known, masculine-inclusive language is the neutral default and
      is correct — "bienvenido" in an opening turn is never a violation. (2)
      Addressing the customer — gendered words agree with the customer's known
      gender, and a known male customer can be addressed as "señor". Masculine
      plural for a mixed-gender group is correct — "lo vemos juntos" for a female
      agent and a male customer is right. (3) Noun and internal agreement —
      articles, adjectives, participles, and gendered numbers agree with their
      actual referent, as in "la reserva está confirmada", "doscientos euros", and
      "doscientas reservas". Resolve the referent before judging a pronoun or
      demonstrative — a masculine pronoun whose antecedent is a masculine noun is
      correct even in a sentence full of feminine nouns.
    ai_likely_does: (1) Self-reference — a known female agent uses masculine forms
      for herself, such as "encantado de ayudar" or "estoy listo", or a known male
      agent says "estoy lista". Spoken slash-alternatives are always a violation
      regardless of gender — saying "listo/a" aloud is wrong on its face; the
      speaker must commit to one form. (2) Customer-directed — gendered words
      contradict the customer's known gender, such as "señor" to a known female
      customer, "cuando estés listo" to a known female customer, or a feminine
      plural that includes a known male customer, such as "lo vemos juntas". (3)
      Noun agreement — a clear mismatch with the actual referent, such as "la
      reserva está confirmado" or "doscientos reservas". Never infer gender from a
      name. If gender is unknown, judge only the agreement visible in the
      utterance. Judge only clear agreement errors — word-for-word English calques
      and awkward-but-agreeing phrasing belong to other criteria, not here.
  - factor_id: natural_word_choice
    nuance: Combined utterance naturalness for Madrid Spanish
    question: >-
      This is a customer-service call in contemporary Spanish as spoken in Madrid,
      Spain. Does this utterance use natural Madrid Spanish without translationese
      or unnatural word choice, and with correct verb forms and basic function
      words?
    native_does: >-
      Natural conversational Madrid Spanish appropriate to a customer-service call
      passes, including ordinary formal or informal speech and established English
      borrowings or code-switching when they sound natural in context. Literal
      names, identifiers, and genuinely user-visible product, interface, setting,
      or status labels that must be preserved may remain in English when naturally
      integrated. Vocabulary and grammar must be natural in contemporary Madrid
      Spanish, with an internally consistent regional variety; regional validity
      elsewhere does not by itself pass. Judge language use only, not factual or
      task correctness.
    ai_likely_does: >-
      Inspect every complete clause independently. Permitted English, technical
      material, or natural wording elsewhere does not excuse a separate defect.
      Flag language that would sound clearly odd, ungrammatical, or non-Madrid in
      this setting, including English-shaped or word-for-word service phrasing or
      result constructions; unnatural word choice, collocation, or customer-facing
      backend language; avoidable raw English where Spanish is ordinarily expected;
      a clear error in verb form, subject-verb person or number, required clitics or
      governed prepositions, ser/estar, por/para, or other basic function words; and
      lexical, grammatical, or second-person forms that are not natural in
      contemporary Madrid Spanish. Also flag within-utterance mixing of Madrid and
      non-Madrid regional varieties. One clear marker in the utterance is
      sufficient; it need not recur across the call. Also flag missing, extra, or
      misplaced written Spanish diacritics, including accent marks, ñ, and ü, when
      standard orthography requires them. Ignore only a diacritic issue that is part
      of an obvious transcription artifact or the clipped ending of an interrupted
      turn. Quotation marks or apparent system provenance alone do not make an
      untranslated generic category or ordinary service term acceptable. Also flag
      a generic customer-data word when its ordinary Spanish meaning does not
      naturally identify the specific field being requested. A merely smoother,
      more specialized, or more formal alternative is not enough. Do not flag
      gender agreement, politeness, or mere switching between otherwise natural
      Madrid formal and informal forms of address. For interrupted turns, judge
      complete material before the cutoff and ignore only the clipped ending.
  - factor_id: request_politeness
    enabled: false
    nuance: Request softening / politeness routines
    question: Did the agent make requests with a natural level of politeness for a
      service call?
    native_does: Uses a polite question, conditional, or simple softener. Examples are
      "¿Me puede dar su número?", "Cuando pueda", "Si no es molestia", and "¿Sería
      tan amable de confirmarlo?". A direct request can still be polite; every request
      does not need several softeners.
    ai_likely_does: Repeatedly gives the customer bare commands such as "Dame tu
      número" or "Confirma ahora" when a polite request is expected. Judge the force of
      the request here; the choice between usted and tú belongs to the register
      criterion.
  - factor_id: counting_units
    nuance: Spanish number scale and decimal reading
    question: When the agent said a large number, an amount, or a decimal, did it
      use the natural Spanish number scale and reading?
    native_does: Uses the Spanish long scale and the decimal comma. Examples are
      "mil millones de dólares" for the English billion, "quinientos mil", "dos
      coma cinco" for 2.5, and "treinta y cinco euros con cincuenta". "Un billón"
      is correct only when a true million millions is meant.
    ai_likely_does: Reads a number on the English scale or with an English decimal
      point. Examples are "un billón" for the English billion instead of "mil
      millones", "quinientos miles" instead of "quinientos mil", and "dos punto
      cinco" instead of "dos coma cinco". Do not flag "punto" in emails or
      websites such as "gmail punto com", digits read one by one in codes or
      phone numbers, or a figure the customer said that the agent merely echoed.
  - factor_id: name_address_conventions
    enabled: false
    nuance: Natural name and title address
    question: When the agent addressed the customer by name, did it pair the name
      and title the way a Spanish speaker would?
    native_does: Pairs señor or señora with the surname in formal address and uses
      the bare first name under tuteo. Examples are "señor Sánchez", "señora
      García, ¿me confirma el código?", and "Gracias, Lucía" in a tuteo call.
      "Don" or "doña" with the first name is also natural, and addressing the
      customer without any name is fine. If the agent never uses the customer's
      name, there is no opportunity.
    ai_likely_does: Pairs señor or señora with the bare first name, such as "señor
      Iván" instead of "señor Sánchez" or "don Iván"; addresses the customer by
      surname alone, such as "Sánchez, ¿me confirma?"; or keeps addressing the
      customer with the full name, such as "señor Iván Sánchez" in turn after
      turn. Do not require name use or infer gender from a name. Judge the choice
      between usted and tú under the register criterion and a wrong-gender title
      under the gender-agreement criterion.
  enabled_deterministic_factors:
  - email_symbol_verbalization
  email_symbols:
    '@':
    - arroba
    .:
    - punto

# --- delivery scoring (audio-layer) ---
# judge_factors select from the closed catalog in tau2.multilingual.delivery_catalog;
# factor_id must exist there (the loader rejects unknown ids). Rubrics are grounded
# in confirmed human-annotation findings (docs/multilingual/annotation/nuance_map.json).
delivery:
  judge_factors:
  - factor_id: regional_accent_consistency
    listen_for: Pronunciation that repeatedly conflicts with the configured
      Spanish locale or audibly switches between incompatible systems within
      the call, such as sustained switching between distinción and seseo.
      Accept ordinary speaker variation and judge against the simulation's
      configured locale, not one preferred Spanish accent.

# --- spoken localization (symbols / date-numeral rule / speech conventions / domain glossary) ---
# Upgraded by `tau2 factory draft-localization`: domain_glossaries[retail] drafted by prompt v7 sha256:6c4c09381c8b (model:claude-opus-4-8);
# all previously-reviewed fields preserved verbatim.
# Symbols and term_ids select from the closed catalogs in
# tau2.multilingual.localization_catalog (the loader rejects unknown ids).
localization:
  symbol_readouts:
  - symbol: '@'
    spoken:
    - arroba
  - symbol: .
    spoken:
    - punto
  - symbol: _
    spoken:
    - guion bajo
  - symbol: '-'
    spoken:
    - guion
    - raya
  - symbol: /
    spoken:
    - barra
    - barra inclinada
  - symbol: +
    spoken:
    - más
    - signo de más
  - symbol: '0'
    spoken:
    - cero
  date_examples:
  - written: May 17
    spoken: diecisiete de mayo
  - written: 05/17
    spoken: diecisiete del cinco
  - written: December 3
    spoken: tres de diciembre
  - written: '2024-11-21'
    spoken: veintiuno de noviembre de dos mil veinticuatro
  number_examples:
  - written: 253 dollars
    spoken: doscientos cincuenta y tres dólares
  - written: '21'
    spoken: veintiuno
  - written: 1.250,75 €
    spoken: mil doscientos cincuenta euros con setenta y cinco céntimos
  - written: '+49'
    spoken: más cuarenta y nueve
  domain_glossaries:
    airline:
    - term_id: user_id
      native: ID de usuario
      note: airline user id is an alphanumeric handle (e.g. 'mia_li_3668'), not numeric;
        'ID' spelled i-de; avoid 'número' which implies digits only
    - term_id: reservation
      native: reserva
    - term_id: reservation_id
      native: localizador
      note: '''localizador'' is the usual term; also ''código de reserva'''
    - term_id: flight
      native: vuelo
    - term_id: flight_number
      native: número de vuelo
    - term_id: refund
      native: reembolso
      note: in casual register also 'el refund'
    - term_id: travel_insurance
      native: seguro de viaje
    - term_id: checked_bag
      native: maleta facturada
      note: also 'equipaje facturado'
    - term_id: carry_on
      native: equipaje de mano
    - term_id: future_trip
      native: viaje futuro
      note: also 'un viaje que tengo pendiente'
    - term_id: one_way
      native: viaje de ida
    - term_id: round_trip
      native: viaje de ida y vuelta
    - term_id: basic_economy
      native: clase turista básica
      note: also 'la tarifa básica'
    - term_id: economy
      native: clase turista
    - term_id: business
      native: clase business
      note: '''business'' is an established English loanword, the usual term; also
        ''clase preferente'''
    - term_id: credit_card
      native: tarjeta de crédito
    - term_id: gift_card
      native: tarjeta regalo
      note: '''tarjeta regalo'' dominates in Spain; the English ''gift card'' is not
        the usual spoken form'
    - term_id: travel_certificate
      native: bono de viaje
      note: also 'vale de viaje'
    - term_id: membership_tier
      native: nivel de socio
      note: regular / plata / oro; also 'nivel de fidelidad'
    - term_id: cancellation
      native: cancelación
    - term_id: payment_method
      native: forma de pago
      note: also 'método de pago'
    telecom:
    - term_id: customer_id
      native: número de cliente
    - term_id: phone_number
      native: número de teléfono
    - term_id: line
      native: línea
    - term_id: plan
      native: plan
      note: also 'tarifa' in Peninsular register; both natural
    - term_id: data_allowance
      native: datos incluidos
      note: colloquially 'los gigas que tengo'
    - term_id: data_usage
      native: consumo de datos
    - term_id: data_refuel
      native: recarga de datos
      note: the extra data top-up bought mid-cycle
    - term_id: mobile_data
      native: datos móviles
    - term_id: roaming
      native: roaming
      note: established loanword; what everyone says in Spain
    - term_id: airplane_mode
      native: modo avión
    - term_id: sim_card
      native: tarjeta SIM
      note: often just 'la SIM'
    - term_id: esim
      native: eSIM
      note: established loanword; read 'i sim'
    - term_id: apn_settings
      native: ajustes del APN
      note: '''APN'' spelled out a, pe, ene'
    - term_id: data_saver
      native: ahorro de datos
    - term_id: wifi
      native: wifi
      note: established loanword; said 'el wifi'
    - term_id: wifi_calling
      native: llamadas por wifi
    - term_id: vpn
      native: VPN
      note: spelled out uve, pe, ene
    - term_id: speed_test
      native: test de velocidad
      note: '''test'' is a common loanword; also ''prueba de velocidad'''
    - term_id: network_signal
      native: cobertura
      note: colloquially 'las rayitas' or 'la señal'
    - term_id: status_bar
      native: barra de estado
    - term_id: mms
      native: MMS
      note: spelled out eme, eme, ese
    - term_id: bill
      native: factura
    - term_id: overdue_bill
      native: factura pendiente
      note: the one unpaid and past due
    - term_id: payment_request
      native: enlace de pago
      note: the link the agent sends to pay
    - term_id: line_suspension
      native: línea suspendida
    - term_id: payment_method
      native: forma de pago
      note: also 'método de pago'
    retail:
    - term_id: user_id
      native: identificador de usuario
      note: casual register often says 'el usuario' or the loanword 'el user ID'.
    - term_id: zip_code
      native: código postal
    - term_id: order
      native: pedido
    - term_id: order_id
      native: número de pedido
      note: literally 'order number'; the natural everyday term.
    - term_id: order_status
      native: estado del pedido
    - term_id: pending_order
      native: pedido pendiente
    - term_id: delivered_order
      native: pedido entregado
    - term_id: cancellation
      native: cancelación
    - term_id: return
      native: devolución
    - term_id: exchange
      native: cambio
    - term_id: refund
      native: reembolso
      note: casual register commonly code-switches to the loanword 'el refund'.
    - term_id: product
      native: producto
    - term_id: item
      native: artículo
    - term_id: product_option
      native: opción
      note: when specifying, natives say 'color', 'talla' or 'material'.
    - term_id: item_id
      native: número de artículo
    - term_id: product_id
      native: número de producto
    - term_id: availability
      native: disponibilidad
    - term_id: price_difference
      native: diferencia de precio
    - term_id: tracking_number
      native: número de seguimiento
      note: casual register often uses the loanword 'el tracking'.
    - term_id: shipping_address
      native: dirección de envío
    - term_id: default_address
      native: dirección predeterminada
      note: also 'la dirección por defecto' in everyday usage.
    - term_id: payment_method
      native: método de pago
    - term_id: credit_card
      native: tarjeta de crédito
    - term_id: gift_card
      native: tarjeta regalo
      note: casual register also says the loanword 'la gift card'.
    - term_id: paypal
      native: PayPal
      note: brand name; pronounced as in English.
    - term_id: human_agent
      native: agente humano
      note: also 'una persona' / 'un operador de verdad' in everyday speech.
  phone_number_readout:
    rule: 'Spanish speakers group phone numbers in short blocks (Spain mobile: 3-2-2-2,
      e.g. 612 34 56 78; Spain landline: 2-3-2-2, e.g. 91 234 56 78) and read them
      digit by digit within each block, pausing between blocks. Grouping digits into
      two-digit numbers (sesenta y uno...) is acceptable but when unsure a native
      falls back to strict digit-by-digit for clarity. An initial ''+'' is read ''más''
      followed by the country-code digits.'
    examples:
    - written: 612 34 56 78
      spoken: seis, uno, dos... tres, cuatro... cinco, seis... siete, ocho
    - written: 91 234 56 78
      spoken: nueve, uno... dos, tres, cuatro... cinco, seis... siete, ocho
    - written: +34 655 40 12 90
      spoken: más, tres, cuatro... seis, cinco, cinco... cuatro, cero... uno, dos...
        nueve, cero
  amount_readout:
    rule: The currency word goes AFTER the amount, spoken in full words (never digit
      by digit). The decimal separator is the comma, spoken 'con' before the cents
      (or 'coma' when reading a bare decimal number). Large amounts use 'mil' and
      'millón/millones'. Currency for this pack is euros.
    examples:
    - written: 253 €
      spoken: doscientos cincuenta y tres euros
    - written: 35,50 €
      spoken: treinta y cinco euros con cincuenta
    - written: 1.250,75 €
      spoken: mil doscientos cincuenta euros con setenta y cinco
    - written: 12.000 €
      spoken: doce mil euros
  spelling_alphabet:
    rule: Spanish speakers disambiguate letters with the 'letra DE palabra ancla'
      pattern, anchoring on Spanish given names and cities (B de Barcelona, M de Madrid,
      A de Antonio, V de Valencia, E de España). Letters are named with Spanish letter
      names (be, ce, uve, i griega, etc.).
    avoid: The NATO/anglo phonetic alphabet ('B for Bravo', 'B for boy').
    anchor_examples:
    - written: B
      spoken: B de Barcelona
    - written: M
      spoken: M de Madrid
    - written: A
      spoken: A de Antonio
    - written: V
      spoken: uve de Valencia
    - written: E
      spoken: E de España
  spoken_value_examples:
  - kind: email
    written: juan_perez@gmail.com
    spoken: Sí, es juan guion bajo perez arroba gmail punto com
  - kind: user_id
    written: mia_li_0
    spoken: Mi número de usuario es eme, i, a, guion bajo, ele, i, guion bajo, cero
  - kind: phone
    written: 612 34 56 78
    spoken: Mi teléfono es seis, uno, dos... tres, cuatro... cinco, seis... siete,
      ocho
  - kind: spelling_name
    written: RUBEN
    spoken: Es erre, u, be, e, ene... R de Ramón, U de Úrsula, B de Barcelona, E de
      España, N de Navarra
  - kind: account_number
    written: ZFA04Y
    spoken: Mi número de reserva es zeta, efe, a, cero, cuatro, i griega
  - kind: website
    written: www.example.com/soporte
    spoken: Estaba en su página, doble ve, doble ve, doble ve punto example punto
      com barra soporte
  guideline_examples:
  - kind: disfluency_fillers
    utterances:
    - eh...
    - este...
    - o sea
    - a ver
    - pues nada
    - bueno
    - viste
    - ¿sabe?
  - kind: restart_example
    utterances:
    - ¿Usted puede—perdón, lo que quería preguntar era si me podría ayudar con...
  - kind: filler_pause_example
    utterances:
    - Pues, eh, estaba pensando si, a ver, me podría echar una mano con esto.
  - kind: pause_marker_examples
    utterances:
    - Estaba intentando—espere, déjeme pensar [pause]
    - El problema empezó [pause] hace como tres días, creo.
  - kind: self_interruption_example
    utterances:
    - Estaba intentando... ah, espere, ¿le doy primero el número de cuenta?
  - kind: clarification_request
    utterances:
    - Perdón, ¿me lo repite? No le escuché bien.
  - kind: emotion_examples
    utterances:
    - La verdad es que me molesta bastante porque...
    - ¡Ah, mirá, eso me viene bárbaro!
  - kind: conversational_confirmations
    utterances:
    - claro
    - vale
    - dale
    - de acuerdo
    - muy bien
    - ajá
    - sí, sí
    - por supuesto
  - kind: silence_checkins
    utterances:
    - ¿Hola? ¿Me escucha?
    - ¿Encontró algo?
    - ¿Alguna novedad con lo que le comenté?
  - kind: frustrated_endings
    utterances:
    - Esto ya es demasiado, llamo más tarde.
    - No tengo tiempo para esto, cuelgo.
  - kind: dont_know_responses
    utterances:
    - Uy, la verdad no sé.
    - Ahora mismo no lo recuerdo.
    - Mmm, eso lo tendría que mirar.
  - kind: make_agent_work_chain
    utterances:
    - No funciona.
    - La aplicación.
    - Su app del móvil.
  - kind: one_at_a_time_example
    utterances:
    - Sí, mi correo es juan guion bajo perez arroba gmail punto com... ah, ¿también
      necesita el teléfono?
  - kind: forget_details_example
    utterances:
    - Mi número de pedido es... eh, espere, déjeme ver...
  - kind: vague_openers
    utterances:
    - Tengo un problema.
    - Pasa algo raro con mi cuenta.
  - kind: unknown_info_phrases
    utterances:
    - No estoy seguro de eso.
    - No tengo ese dato.
  - kind: tool_acknowledgment
    utterances:
    - Ah, vale, déjeme que lo pruebo... un momento.
  - kind: tool_result_report
    utterances:
    - Vale, ya lo hice y, eh, me sale que...
  - kind: tool_failure_report
    utterances:
    - Mmm, no funcionó... me está dando un error.
  - kind: multiple_actions_pushback
    utterances:
    - Uy, eso es mucho de golpe... ¿me lo puede ir explicando paso a paso?
  - kind: gratitude_examples
    utterances:
    - ¡Ay, muchísimas gracias!
    - Genial, le agradezco de verdad la ayuda.
  spelled_entity_normalization: false
  letter_names: {}
  digit_names: {}
# --- text input styles (closed catalog: tau2.multilingual.text_input_catalog) ---
# Applicability decision (docs/designs/text-mode-multilingual.md): typing
# without tildes/accents (and without ¿ ¡) is routine in informal Spanish
# chat. Examples are persona-neutral typing MECHANICS only.
text_input:
  styles:
  - style: diacritic_free
    examples:
    - standard: ¿Cuándo sale mi vuelo a Bogotá?
      typed: Cuando sale mi vuelo a Bogota?
    - standard: No sé qué pasó con mi reservación
      typed: No se que paso con mi reservacion
    - standard: Está bien, muchísimas gracias
      typed: Esta bien, muchisimas gracias
