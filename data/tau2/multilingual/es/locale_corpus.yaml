# Locale identity corpus for es (Spain) — reviewed raw material for the
# `tau2 factory localize-entities` step. Values are authored in correct
# Peninsular Spanish orthography, DIACRITICS INCLUDED (González, Álvaro,
# Constitución): these strings are what the caller says out loud and what the
# agent reads back, so an unaccented spelling is simply a misspelling. The
# generator romanizes them for the derived user_ids and email local parts, so
# those stay ASCII. It draws deterministically per caller (seeded by the
# original user_id) and preserves the numeric suffix for user_id uniqueness.
country: ESP
phone_number_format: "6## ## ## ##"
email_domain: example.com
zip_format: "#####"
address_format:
  city_region: "{city}, {region}"
  city_country: "{city}, {region}, {country}"
address_review:
  source: "reviewed localization corpus (updated 2026-08-03)"
  status: annotator_feedback_applied

