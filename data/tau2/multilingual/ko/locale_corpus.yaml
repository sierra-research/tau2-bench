# Locale identity corpus for ko (South Korea, standard Seoul Korean) —
# reviewed raw material for the `tau2 factory localize-entities` step. All
# values are romanized (common everyday Revised-Romanization spellings — the
# model's validator rejects native-script names); the generator draws
# deterministically per caller (seeded by the original user_id, gender
# inherited from the English caller's given name) and preserves the numeric
# suffix for user_id uniqueness. Region codes follow ISO 3166-2:KR (numeric,
# matching the pack's KR-11 / KR-26 persona locales).
country: KOR
phone_number_format: "010-####-####"
email_domain: example.com
zip_format: "#####"
address_format:
  city_region: "{region} {city}"
  city_country: "{country} {region} {city}"
  full_address: "{region} {city}, {address1}, {address2}, {postcode}"
address_review:
  source: "reviewed localization corpus (updated 2026-08-03)"
  status: annotator_feedback_applied

