# Secondary address line — the unit within the street address, drawn like
# every other field. Retail needs a real one: its records always carry a
# "Suite NNN" and some tasks turn on the unit NEXT DOOR (task 17 wants
# delivery to Suite 641 when the record says Suite 640), which only works
# if the locale line has a number of its own to move. Exactly one number
# per pattern, for that reason.
secondary_line_patterns:
  - "{n}-ho"
  - "{n}-dong"
  - "{n}-cheung"
secondary_line_number_max: 19

cities:
  - {city: Seoul, region: "11"}
  - {city: Busan, region: "26"}
  - {city: Incheon, region: "28"}
  - {city: Daegu, region: "27"}
