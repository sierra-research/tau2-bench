  retail:
    regional_bundle_file: regional/retail.json
    revision: voice-v2-frozen50-name-order-v3
    task_metadata_file: retail_metadata_ko.json
    voice_guidelines: '## LANGUAGE LOCALIZATION (Korean)


      ### Dates and numbers — one language only

      Say every date and number ENTIRELY in Korean. Never mix English and Korean words
      inside one date or number — the whole value is voiced in Korean, not half in
      each language.

      Native readouts:

      - ''May 17'' → “오월 십칠일”

      - ''05/17'' → “오월 십칠일”

      - ''December 3'' → “십이월 삼일”

      - ''2024-01-09'' → “이천이십사년 일월 구일”

      - ''253 dollars'' → “이백오십삼 달러”

      - ''35,000원'' → “삼만 오천 원”

      - ''21 (a date or price)'' → “이십일”

      - ''21 (counting items or age)'' → “스물하나”

      - ''3h'' → “세 시간”

      - ''+82 10 1234 5678'' → “플러스 팔이 일공 일이삼사 오륙칠팔”


      ### Phone numbers

      Korean mobile numbers are read digit-by-digit in Sino-Korean numerals, with
      0 written as ''공''. Group as 3-4-4 (010-XXXX-XXXX). Landlines group by area
      code then the remaining blocks. Never read a block as a composed number word
      (e.g. 1234 as ''천이백삼십사''); always digit-by-digit.

      Native readouts:

      - ''010-1234-5678'' → “공, 일, 공 — 일, 이, 삼, 사 — 오, 육, 칠, 팔”

      - ''02-777-0100'' → “공, 이 — 칠, 칠, 칠 — 공, 일, 공, 공”


      ### Amounts and prices

      The currency word (''원'' for won, ''달러'' for dollars) follows the number. Amounts
      are read in Sino-Korean numerals grouped by the Korean myriad units 만 (10,000)
      and 억 (100,000,000): 35,000 → ''삼만 오천''. For decimals, the decimal separator
      is read ''점'' and the fractional digits are read digit-by-digit; cents in dollar
      amounts are commonly read as ''달러 …센트''.

      Native readouts:

      - ''35,000 won'' → “삼만 오천 원”

      - ''1,500,000 won'' → “백오십만 원”

      - ''253.75 dollars'' → “이백오십삼 달러 칠십오 센트”


      ### Spelling only on request

      Spell a name, ID, email, or code character by character only when the agent
      explicitly asks you to spell it. A request to repeat a value or a failed lookup
      is not a request to spell it. Add word anchors or character explanations only
      when the agent specifically asks for anchors or explanations; a spelling request
      alone does not request anchors.

      For an explicitly requested Hangul spell-out, use jamo names. For Latin-letter
      codes, use letter names.

      Spelling examples only after an explicit spelling request:

      - ''김'' → “기역, 이, 미음”

      - ''박'' → “비읍, 아, 기역”

      - ''지'' → “지읒, 이”

      - ''B'' → “비”

      - ''M'' → “엠”



      ### Talking about yourself, not the other person

      These words have honorific forms that apply only to the other person. Use the
      plain form about yourself, never the honorific one.

      Do NOT use: 성함, 연세, 생신, 댁

      Native anchors:

      - name → “이름” (not “성함”)

      - age → “나이” (not “연세”)

      - date of birth → “생일” (not “생신”)

      - home → “집” (not “댁”)


      ### Domain terms — say them in Korean

      Use these natural Korean terms for the service vocabulary below; do not switch
      into the English term mid-sentence. Where a note marks the English form as the
      established native usage, that form IS the natural term. If your persona''s
      register genuinely code-switches a term, the persona instructions take precedence.

      - user ID → “아이디” (established loanword; the natural spoken term is ''아이디'',
      not the Sino-Korean ''사용자 식별번호'')

      - zip code → “우편번호”

      - order → “주문”

      - order ID → “주문번호”

      - order status → “주문 상태”

      - pending order → “아직 배송 안 된 주문” (descriptive spoken form; formal register also
      ''배송 대기 중인 주문'')

      - delivered order → “배송된 주문” (casual register also ''이미 받은 주문'')

      - cancellation → “취소” (casual register also uses the loanword ''캔슬'')

      - return → “반품”

      - exchange → “교환”

      - refund → “환불”

      - product → “상품” (the product TYPE; also ''제품'')

      - item → “품목” (a specific variant; casual speakers often just say ''그 옵션'' or
      ''그거'')

      - option → “옵션” (established loanword; ''옵션'' is the natural spoken term for
      colour/size/etc.)

      - item ID → “품목 번호” (also ''아이템 번호'' in casual/IT register)

      - product ID → “상품 번호”

      - availability → “재고” (spoken as ''재고 있어요?'' for in-stock)

      - price difference → “차액”

      - tracking number → “송장번호” (also ''운송장 번호''; casual register ''트래킹 번호'')

      - shipping address → “배송지 주소” (also just ''배송지'')

      - default address → “기본 배송지”

      - payment method → “결제 수단”

      - credit card → “신용카드” (often shortened to ''카드'')

      - gift card → “기프트 카드” (established loanword; ''상품권'' in some contexts)

      - PayPal account → “페이팔” (established loanword, always transliterated)

      - human agent → “상담원” (human representative; ''상담사'' is a formal variant)'
