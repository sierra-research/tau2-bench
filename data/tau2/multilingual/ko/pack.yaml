  phone_number_readout:
    rule: Korean mobile numbers are read digit-by-digit in Sino-Korean numerals, with
      0 pronounced '공'. Group as 3-4-4 (010-XXXX-XXXX), pausing between blocks. Landlines
      group by area code then the remaining blocks. Never read a block as a composed
      number word (e.g. 1234 as '천이백삼십사'); always digit-by-digit. Within a block the
      digits may be delivered as a fluent run ('일이삼사') or with deliberate pauses ('일,
      이, 삼, 사') — both are digit-by-digit readings.
    examples:
    - written: 010-1234-5678
      spoken: 공, 일, 공 — 일, 이, 삼, 사 — 오, 육, 칠, 팔
    - written: 02-777-0100
      spoken: 공, 이 — 칠, 칠, 칠 — 공, 일, 공, 공
  amount_readout:
    rule: 'The currency word (''원'' for won, ''달러'' for dollars) follows the number.
      Amounts are read in Sino-Korean numerals grouped by the Korean myriad units
      만 (10,000) and 억 (100,000,000): 35,000 → ''삼만 오천''. For decimals, the decimal
      separator is read ''점'' and the fractional digits are read digit-by-digit; cents
      in dollar amounts are commonly read as ''달러 …센트''.'
    examples:
    - written: 35,000 won
      spoken: 삼만 오천 원
    - written: 1,500,000 won
      spoken: 백오십만 원
    - written: 253.75 dollars
      spoken: 이백오십삼 달러 칠십오 센트
  spelling_alphabet:
    rule: 'For Hangul names, decompose each syllable into its jamo, said one by one
      by jamo name: ''김'' → ''기역, 이, 미음''; ''박'' → ''비읍, 아, 기역''. Decomposing the
      full name this way is for when the listener explicitly asks for a spell-out
      (as in the spelling_name example); unprompted, natives typically decompose only
      the ambiguous syllable (e.g. distinguishing ''재'' from ''제'') rather than routinely
      spelling out a whole name. For Latin letters in codes, say each letter by its
      Korean-pronounced English letter name (에이, 비, 씨, 디…), separated with comma and
      space; alphanumeric codes are read character-by-character.'
    avoid: The NATO/anglo phonetic alphabet ('Alpha, Bravo, Charlie' or 'B for boy');
      Korean spells names by jamo decomposition, not by anchor words.
    anchor_examples:
    - written: 김
      spoken: 기역, 이, 미음
    - written: 박
      spoken: 비읍, 아, 기역
    - written: 지
      spoken: 지읒, 이
    - written: B
      spoken: 비
    - written: M
      spoken: 엠
  # Honorific words the caller must not apply to itself. For example, 성함 is
  # the honorific word for a listener's name; a speaker uses 이름 for their own
  # name. The plain alternatives below keep self-reference non-honorific.
  # PENDING NATIVE REVIEW: all four pairs.
  honorific_self_reference:
  - concept_id: name
    honorific: 성함
    plain: 이름
  - concept_id: age
    honorific: 연세
    plain: 나이
  - concept_id: birthday
    honorific: 생신
    plain: 생일
  - concept_id: home
    honorific: 댁
    plain: 집
