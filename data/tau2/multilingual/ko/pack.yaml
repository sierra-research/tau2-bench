translation_guidance: 'Target register: natural spoken Standard Korean (표준어). Honorific
  level is the single most important register dimension — match the persona. Service/professional
  speech defaults to the deferential 하십시오체 (''확인했습니다'', ''기다려 주시겠습니까?'') or the polite
  해요체 (''확인했어요'', ''기다려 주실래요?''); casual speakers use 해요체 sliding toward 반말. Never
  mix 하십시오체 and 반말 in the same speaker''s text.


  LOANWORD / CODE-SWITCHING POLICY:

  - Established English loanwords for tech, money, travel, and everyday terms are
  the INTENDED register and should be written in Hangul transliteration where that
  is the natural spelling: 앱, 예약, 캔슬, 카드, 이메일, 시스템, 체크, 리필, 오케이. Latin-script insertions
  (status, refund) are acceptable for the casual urban-professional/student register;
  keep them inline. Do NOT over-purify into stiff Sino-Korean equivalents when the
  loanword is what a real speaker would say (e.g. don''t force ''cancel'' into ''해약''
  if ''캔슬'' is natural for the persona). Korean stays the matrix language; English
  words are insertions.

  - For the formal bank-supervisor register, prefer the precise Korean/Sino-Korean
  term (계좌, 해지, 확인) and keep loanwords minimal.


  CALQUE TRAPS (translate the MEANING, not the words):

  - ''if and only if'' must NOT become a literal calque. Use ''오직 ~할 때만'' or ''~인
  경우에 한해서만''.

  - ''as soon as possible'' -> ''가능한 한 빨리'', not a word-for-word string.

  - ''make sure that'' -> ''~인지 꼭 확인하세요'' / ''반드시 ~하도록 하세요'', not a literal ''확실하게
  만들다''.

  - Conditionals: Korean marks the condition with ''-(으)면'' / ''-(ㄴ)다면'' and keeps
  the consequence; map English if/then faithfully — ''상담원이 거절하면, 더 우기지 마세요''.

  - English ''you'' is usually NOT translated as ''당신'' (which sounds confrontational
  or like a textbook). Drop the subject or use a role/title (고객님, 상담원). Address with
  appropriate honorific forms instead.


  GENDER:

  - Korean verbs and adjectives do NOT inflect for the speaker''s gender, so there
  is no gendered-verb agreement to track and no masculine/feminine default to choose.
  The same prose serves any speaker; the persona''s gender is realized only through
  the voice. Do not invent gender marking. The only register agreement to keep CONSISTENT
  within one text is the honorific level (do not switch between 하십시오체, 해요체, and 반말
  for the same speaker).


  SCRIPT / NUMBER CONVENTIONS:

  - Korean prose is Hangul. All concrete values — ids, codes, amounts, dates, reservation/flight
  numbers — stay verbatim with Latin digits (1, 2, 3) and Latin letters where they
  originate; do not convert to Korean numeral words in written text. An attached unit/word
  localizes (''3h'' -> ''3시간''; keep the digit, translate the unit).

  - Spoken readings (for voice/TTS context) follow locale conventions: dates, money
  (원), minutes, and phone numbers use Sino-Korean numerals; counting items/hours/ages
  uses native numerals. Phone numbers are read digit-by-digit with 0 as ''공''. Money
  groups by 만/억 (35,000원 → ''삼만 오천 원''). Email ''@'' is ''골뱅이'', ''.'' is ''점''. Latin
  letters spelled by English name (에이, 비, 씨); alphanumeric codes read character-by-character
  (KR7A → ''케이 알 칠 에이'').


  REGISTER EXAMPLES (natural target):

  - Formal (Jihun): ''예, 말씀하신 계좌 확인했습니다. 잠시만 기다려 주시겠습니까?''

  - Casual (Soyeon): ''아 그거 그냥 캔슬해 주세요~ 앱에서는 안 되던데요?''

  - Conditional: ''상담원이 거절하면, 너무 우기지 마세요.'''
