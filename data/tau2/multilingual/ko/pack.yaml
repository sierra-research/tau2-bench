# --- nativeness scoring ---
# judge_factors select from the closed catalog in tau2.multilingual.nativeness_catalog;
# factor_id must exist there (the loader rejects unknown ids). email_symbols
# are native verbalizations of email symbols for the deterministic checker.
nativeness:
  judge_factors:
  - factor_id: honorific_levels
    enabled: false
    nuance: 'Honorific speech levels (존댓말: 합쇼체/해요체)'
    question: Did the agent use polite Korean with the customer throughout the call?
    native_does: Uses 존댓말. Both 합쇼체 and 해요체 are natural in a South Korean
      service call, and the agent may move between them. Examples are "확인해
      드리겠습니다", "확인해 볼게요", and "잠시만 기다려 주세요". A clipped
      fragment or quiet self-talk such as "어디 보자" is also fine.
    ai_likely_does: Directs sustained 반말 at the customer, such as repeatedly saying
      "이름 말해", "기다려", or "알겠어?". Do not flag 해요체, and do not flag one
      isolated plain ending in an otherwise polite call.
  - factor_id: honorific_agreement
    enabled: true
    nuance: Honorific agreement with the grammatical subject
    question: Did the agent use -시- for the customer's actions and avoid using it for
      the agent's own actions?
    native_does: Honors the customer as the grammatical subject. Examples are
      "고객님께서 신청하신 예약" and "확인하셨나요?". For the agent's own action,
      "제가 확인하겠습니다" is natural. The final ending may be either -요 or
      -습니다.
    ai_likely_does: Clearly omits -시- where the customer is being honored, points
      the honorific at the agent's own action, or attaches -시- to an inanimate
      subject. Examples are "고객님께서 신청한 예약", "제가 확인하시겠습니다", and
      "결제가 완료되셨습니다". One clear instance is enough. Do not guess when
      the subject is omitted or ambiguous; "고객님이 필요한 서류" alone is not a
      clear omission. Natives frequently drop -시- inside pre-nominal (relative)
      clauses ("주문한 상품", "입력한 우편번호") and in connective clauses with
      an omitted subject ("재부팅을 했는데도") - do not flag those. Also do not
      flag indirect honorification (간접높임) of the customer's own needs,
      attributes, or perceptions - "궁금한 점이 있으신가요?", "성함이 어떻게
      되세요?", and "시간 괜찮으세요?" are natural. Flag only a main clause
      where the customer is the explicit honored subject, -시- attached to the
      agent's own action, or -시- attached to an object, state, or procedure
      that does not belong to the customer, such as "요금제가 변경되셨습니다"
      or "결제가 완료되셨습니다".
  - factor_id: request_politeness
    enabled: false
    nuance: Natural request softening
    question: Did the agent phrase requests naturally instead of repeatedly giving blunt
      commands?
    native_does: Uses a natural request such as "번호를 말씀해 주세요" or "확인해
      주시겠어요?". A short direct instruction can be fine when the context calls for
      it; not every request needs several softeners.
    ai_likely_does: Repeatedly gives command-shaped requests such as "번호를 말씀하세요",
      "지금 확인하세요", or "다시 말하세요" without a reason. Judge request force here.
      Judge -요/-습니다 versus 반말 under honorific speech levels.
  - factor_id: natural_word_choice
    nuance: Combined utterance naturalness for South Korean Korean
    question: >-
      This is a customer-service call in Korean. Does this utterance contain
      translationese or unnatural word choice?
    native_does: >-
      Natural spoken South Korean customer-service Korean passes, including ordinary
      polite or formal speech, established loanwords, and code-switching that sounds
      natural to a native speaker. Literal names, identifiers, and genuine branded
      product, interface, setting, or status labels may remain in English when
      naturally integrated. Ordinary Korean wording for money or credit returning to
      a payment method also passes; do not require the most specialized service verb.
      Judge language use only, not factual or task correctness.
    ai_likely_does: >-
      Flag wording that would sound clearly odd to a native South Korean speaker,
      including English-shaped or word-for-word phrasing, unnatural word choice or
      collocation, and genuinely unnatural backend or system language exposed to the
      customer. Also flag an untranslated generic English category or service term
      when ordinary Korean is expected, awkward duplication of English and Korean
      alternatives, wording that treats verbally supplied information as typed input,
      and a clear customer-service register mismatch such as restarting a greeting
      mid-conversation or using an overly casual interjection. A merely smoother or
      more specialized Korean alternative is not enough. For interrupted turns, judge
      complete material before the cutoff and ignore only the clipped ending.
  - factor_id: counting_units
    enabled: false
    nuance: Natural numbers and counting words (분류사)
    question: Did the agent use the correct counter and Korean number system for the
      thing being counted?
    native_does: Uses native Korean numbers with common counters, such as "수하물 한
      개", "승객 두 명", "세 시간", and "한 시". Uses Sino-Korean where expected,
      such as "삼십 분", and may combine them naturally in "세 시 삼십 분". Other
      natural forms include "표 한 장" and "예약 한 건".
    ai_likely_does: Uses a clearly wrong numeral-counter pair, such as "수하물 일 개"
      instead of "수하물 한 개", "삼 시간" instead of "세 시간", or "사람 두 개"
      instead of "두 명". One clear error is enough. Do not flag a stylistic choice
      between two accepted counters.
  - factor_id: name_address_conventions
    nuance: Korean name order and service-call address
    question: When the agent used the customer's name, did it keep Korean name order and
      attach the title naturally?
    native_does: Keeps family name first and attaches the title to the name. Examples
      are "김민준 고객님" and "김민준 님". Using 고객님 without a name is also natural.
      If the agent never uses the customer's name, there is no opportunity.
    ai_likely_does: Reverses the known localized caller name, such as "김민준" to
      "민준 김", or directly addresses that caller by family name alone as "김 씨".
      Also check every name the agent says, including romanized ones - rendering
      one person's name given-name-first and another person's name family-first
      within the same call is a violation, even when each form alone would be
      fine. One consistently used order is acceptable, and romanizing a single
      Korean name in Western order is acceptable. Do not require name use, infer
      a Korean name from a foreign/source name, or flag spacing before 님, quoted
      reports, third-party names, or an ambiguous reference.
  enabled_deterministic_factors:
  - email_symbol_verbalization
  email_symbols:
    '@':
    - 골뱅이
    .:
    - 점
# --- delivery scoring (audio-layer) ---
# judge_factors select from the closed catalog in tau2.multilingual.delivery_catalog;
# factor_id must exist there (the loader rejects unknown ids). Rubrics are grounded
# in confirmed human-annotation findings (docs/multilingual/annotation/nuance_map.json).
delivery:
  judge_factors:
  - factor_id: regional_accent_consistency
    listen_for: Pronunciation that repeatedly conflicts with standard Seoul
      Korean or audibly switches between incompatible systems within the call —
      sustained regional-dialect intonation, or an English-accented rendering of
      Korean words. Accept ordinary speaker variation; judge against standard
      Seoul Korean, not one preferred voice.

