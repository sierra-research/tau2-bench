# Locale identity corpus for hi (India, urban Hindi-belt) — reviewed raw
# material for the `tau2 factory localize-entities` step. The name POOLS are
# Latin (standard everyday English/romanized spellings, matching the pack's
# urban Mumbai/Delhi personas); the native_* tables below map each pool entry
# to its Devanagari form for the native-script DB ablation. The generator
# draws deterministically per caller (seeded by the original user_id, gender
# inherited from the English caller's given name) and preserves the numeric
# suffix for user_id uniqueness.
country: IND
phone_number_format: "9#### #####"
email_domain: example.com
zip_format: "######"
address_format:
  city_region: "{city}, {region}"
  city_country: "{city}, {region}, {country}"
address_review:
  source: "reviewed localization corpus (updated 2026-08-03)"
  status: annotator_feedback_applied

