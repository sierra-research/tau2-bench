  spellout_section: '## Speaking Special Characters and Numbers

    Spell a name, ID, email, or code character by character only when the agent explicitly
    asks you to spell it. A request to repeat a value or a failed lookup is not a
    request to spell it. Add word anchors or character explanations only when the
    agent specifically asks for anchors or explanations; a spelling request alone
    does not request anchors.


    Local words for special characters:

    - @ (at sign) = "ऐट" or "ऐट द रेट"

    - . (dot) = "डॉट" or "पॉइंट"

    - _ (underscore) = "अंडरस्कोर"

    - - (hyphen) = "हाइफ़न" or "डैश"

    - / (slash) = "स्लैश"

    - + (plus sign) = "प्लस"

    - 0 (zero) = "ज़ीरो" or "शून्य"


    Only after an explicit spelling request, a spelling-only example is "वो है R,
    I, S, H, I".

    Only after a specific request for anchors or character explanations, examples
    are ''R for Rajdhani'', ''B for Bombay'', ''M for Mumbai'', ''D for Delhi'', ''I
    for Imran'', ''I for India'', ''S for Srinagar'', ''H for Hyderabad''.'
