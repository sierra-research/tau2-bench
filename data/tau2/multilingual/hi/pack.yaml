# --- text input styles (closed catalog: tau2.multilingual.text_input_catalog) ---
# Applicability decision (docs/designs/text-mode-multilingual.md): romanized
# Hindi is the dominant chat register; code_mixed adds the Hinglish lexical
# reality on top. Examples are persona-neutral typing MECHANICS only.
text_input:
  styles:
