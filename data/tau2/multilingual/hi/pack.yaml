domains:
  airline:
    regional_bundle_file: regional/airline.json
    revision: voice-v2-frozen50-v1
    task_metadata_file: airline_metadata_hi.json
    voice_guidelines: '## LANGUAGE LOCALIZATION (Hindi)


      ### Dates and numbers — one language only

      Say every date and number ENTIRELY in Hindi. Never mix English and Hindi words
      inside one date or number — the whole value is voiced in Hindi, not half in
      each language.

      Native readouts:

      - ''May 17'' → “सत्रह मई”

      - ''05/17'' → “ज़ीरो पाँच स्लैश सत्रह”

      - ''January 3'' → “तीन जनवरी”

      - ''December 25'' → “पच्चीस दिसंबर”

      - ''253 dollars'' → “दो सौ तिरेपन डॉलर”

      - ''21'' → “इक्कीस”

      - ''1099 dollars'' → “एक हज़ार निन्यानवे डॉलर”

      - ''3'' → “तीन”


      ### Phone numbers

      Indian mobile numbers are 10 digits, typically grouped 5+5 (e.g. ''98765 43210'').
      Read digit-by-digit in English, separating each with comma and space. Zero is
      read as ''zero'' (sometimes ''oh''). Landlines are read digit-by-digit similarly.
      Natives read digit-by-digit rather than as large grouped numbers.

      Native readouts:

      - ''98765 43210'' → “nine, eight, seven, six, five... four, three, two, one,
      zero”

      - ''+91 80402 30190'' → “plus, nine, one... eight, zero, four, zero, two...
      three, zero, one, nine, zero”


      ### Amounts and prices

      Currency word follows the number (''बारह हज़ार रुपये'', ''दो सौ तिरपन डॉलर'').
      Large amounts use the Indian units हज़ार (thousand) and लाख (hundred-thousand),
      or the English units are equally natural. The decimal part is read as ''point''
      followed by the digits (e.g. ''99.50'' -> ''निन्यानवे point पाँच zero''), or
      in currency subunits (''पचास paise'') when natural.

      Native readouts:

      - ''253 dollars'' → “दो सौ तिरपन डॉलर”

      - ''12000 rupees'' → “बारह हज़ार रुपये”

      - ''1250.75'' → “एक हज़ार दो सौ पचास point सात पाँच”


      ### Spelling and anchors only on request

      Spell a name, ID, email, or code character by character only when the agent
      explicitly asks you to spell it. A request to repeat a value or a failed lookup
      is not a request to spell it. Add word anchors or character explanations only
      when the agent specifically asks for anchors or explanations; a spelling request
      alone does not request anchors.

      Use the following locale examples only after the agent specifically requests
      anchors or character explanations:

      - ''B'' → “B for Bombay”

      - ''M'' → “M for Mumbai”

      - ''D'' → “D for Delhi”

      - ''I'' → “I for India”

      - ''R'' → “R for Rajdhani”



      ### Domain terms — say them in Hindi

      Use these natural Hindi terms for the service vocabulary below; do not switch
      into the English term mid-sentence. Where a note marks the English form as the
      established native usage, that form IS the natural term. If your persona''s
      register genuinely code-switches a term, the persona instructions take precedence.

      - user ID → “user ID” (established loanword — natives say the English term)

      - reservation → “booking” (established loanword — ''booking'' is the natural
      usage, not ''आरक्षण'')

      - reservation ID → “booking reference” (loanword; also ''booking ID'')

      - flight → “flight” (established loanword; ''उड़ान'' sounds robotic here)

      - flight number → “flight number” (established loanword)

      - refund → “refund” (established loanword — the English form is the natural
      usage)

      - travel insurance → “travel insurance” (established loanword)

      - checked bag → “checked bag” (established loanword; also ''checked-in luggage'')

      - carry-on bag → “carry-on bag” (established loanword; also ''hand baggage'')

      - future trip → “आगे की trip” (loanword ''trip'' with Hindi matrix)

      - one-way trip → “one-way trip” (established loanword)

      - round trip → “round trip” (established loanword)

      - basic economy → “basic economy” (established loanword — fare-class name kept
      in English)

      - economy → “economy” (established loanword — cabin-class name kept in English)

      - business class → “business class” (established loanword)

      - credit card → “credit card” (established loanword)

      - gift card → “gift card” (established loanword)

      - travel certificate → “travel certificate” (established loanword)

      - membership tier → “membership tier” (loanword; natives say tiers as ''regular
      / silver / gold'')

      - cancellation → “cancellation” (established loanword; verb ''cancel करना'')

      - payment method → “payment method” (established loanword)'
