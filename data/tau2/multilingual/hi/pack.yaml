  phone_number_readout:
    rule: Indian mobile numbers are 10 digits, typically grouped 5+5 (e.g. '98765
      43210'). Read digit-by-digit in English, separating each with comma and space,
      with a slight pause between the two blocks. Zero is read as 'zero' (sometimes
      'oh'). Landlines are read digit-by-digit similarly. Natives read digit-by-digit
      rather than as large grouped numbers.
    examples:
    - written: 98765 43210
      spoken: nine, eight, seven, six, five... four, three, two, one, zero
    - written: +91 80402 30190
      spoken: plus, nine, one... eight, zero, four, zero, two... three, zero, one,
        nine, zero
  amount_readout:
    rule: Currency word follows the number ('बारह हज़ार रुपये', 'दो सौ तिरपन डॉलर').
      Large amounts use the Indian units हज़ार (thousand) and लाख (hundred-thousand),
      or the English units are equally natural. The decimal part is read as 'point'
      followed by the digits (e.g. '99.50' -> 'निन्यानवे point पाँच zero'), or in
      currency subunits ('पचास paise') when natural.
    examples:
    - written: 253 dollars
      spoken: दो सौ तिरपन डॉलर
    - written: 12000 rupees
      spoken: बारह हज़ार रुपये
    - written: '1250.75'
      spoken: एक हज़ार दो सौ पचास point सात पाँच
  spelling_alphabet:
    rule: 'Spell using the Indian English spell-letter convention with Indian place/word
      anchors: ''B for Bombay'', ''M for Mumbai'', ''D for Delhi'', ''I for India''.
      Letters are read out in English one at a time, separated with comma and space.'
    avoid: The NATO/Western phonetic alphabet ('Bravo', 'Delta') or the anglo 'B for boy'
      children's-style anchors.
    anchor_examples:
