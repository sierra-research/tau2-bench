# --- nativeness scoring ---
# judge_factors select from the closed catalog in tau2.multilingual.nativeness_catalog;
# factor_id must exist there (the loader rejects unknown ids). email_symbols
# are native verbalizations of email symbols for the deterministic checker.
nativeness:
  judge_factors:
  - factor_id: register_formality
    enabled: false
    nuance: Natural customer address (आप vs तुम/तू)
    question: Did the agent address the customer too familiarly or switch forms of
      address?
    native_does: Uses आप throughout a service call, or naturally leaves the pronoun
      out. Examples are "आप बताइए", "मैं आपकी मदद करूँगा", and "booking ID बता
      दीजिए". जी can add warmth but is not required.
    ai_likely_does: Addresses the customer as तुम or तू, or switches between आप and a
      familiar pronoun. Examples are "तुम बताओ", "तू रुक", or using आप in one turn
      and तुम in another. Judge only the choice of address here; agreement with आप is
      a separate criterion.
  # Added 2026-08-19 (factor-parity review vs es/pt/zh): consistency of the
  # standard urban Hindustani service variety across the call. Register
  # (aap/tum) and shuddh-vs-Hinglish word choice have their own criteria; this
  # one catches dialect-marked grammar and lexicon drifting into the call.
  - factor_id: regional_consistency
    enabled: false
    nuance: Consistent standard Hindustani
    question: Did the agent consistently speak standard urban Hindustani
      throughout the call?
    native_does: Stays in standard urban Hindustani throughout. Ordinary
      Hinglish, both शुक्रिया and धन्यवाद, and the normal formal range of
      standard Hindi are all fine. One word understood across India does not
      establish a different variety.
    ai_likely_does: Repeatedly mixes dialect-marked grammar or vocabulary into
      the call, or switches between such forms and standard Hindustani.
      Examples are "हमको" or "हमरा" for first person, verb forms such as
      "करत हैं", and "अपन" for "मैं" or "हम". One isolated regional word is
      not enough. Judge grammar and vocabulary here, not accent; आप-versus-तुम
      address belongs to the register criterion and shuddh-versus-Hinglish
      wording to the word-choice criterion.
  - factor_id: honorific_agreement
    enabled: false
    nuance: Correct verb agreement with आप
    question: Did the agent use a familiar or singular verb form with आप?
    native_does: Uses plural or polite verb forms with आप. Examples are "आप बता सकते
      हैं", "आप तैयार हैं", "आप बताइए", and "आपको confirmation देनी होगी". The
      same polite forms are fine when आप is understood rather than spoken. जी is not
      required.
    ai_likely_does: Uses a singular or familiar verb, auxiliary, or command with आप.
      Examples are "आप कर सकता है", "आप तैयार है", "आप बता", and "आप बताओ".
      Judge verb agreement here, not whether the agent chose आप, तुम, or तू.
  # Caller-address carve-out (owner ruling 2026-09-03): with honorific आप,
  # masculine plural is the unmarked polite form for ANY addressee, so
  # आप + masculine plural toward a known female customer is NOT a violation.
  # The factor names its three subtypes explicitly so verdicts stay auditable.
  - factor_id: gender_agreement
    nuance: Gender agreement in one utterance
    question: Did gendered language agree internally and with the known agent or
      customer gender supplied in the judge context?
    native_does: Catch three subtypes of agreement. (1) Agent self-reference — a
      known female agent uses feminine first-person forms, such as "मैं आपकी मदद कर
      सकती हूँ". (2) Addressing the customer — with आप, masculine plural is the
      normal polite form for any addressee, including a known female customer;
      "आप बता सकते हैं" and "आप कर रहे हैं" said to a woman are correct and must
      never be flagged. (3) Noun and internal agreement — gendered adjectives,
      participles, and verbs agree with their nouns and with gender established
      earlier in the utterance, as in "आपकी booking cancel हो गई है". English
      loanwords have no fixed grammatical gender, so masculine default agreement
      with them is also correct — "अपना यूजर आईडी बताइए" must never be flagged.
    ai_likely_does: Violations, by the same three subtypes. (1) Self-reference — a
      known female agent saying "मैं आपकी मदद कर सकता हूँ" or "मैं समझ गया". Spoken
      slash-alternatives are always a violation regardless of gender — a speaker
      never voices both forms, so "मैं सुन रहा/रही हूँ" or "बता देता/देती हूँ" is
      wrong on its face; the agent must commit to one form.
      (2) Addressing the customer — feminine forms toward a known male customer,
      such as "आप परेशान लग रही हैं" said to a man; masculine plural with आप is
      never a violation, whatever the customer's gender. (3) Noun agreement —
      conflicting endings in one clear construction, such as "booking cancel हो
      गया" after booking has been established as feminine. If gender is neither
      supplied nor internally established, mark no opportunity.
  - factor_id: natural_word_choice
    nuance: Combined utterance naturalness for Hindi and Hinglish
    question: >-
      This is a customer-service call in Hindi. Does this utterance contain any
      translationese, verb-morphology or core grammar error, or unnatural word
      choice?
    native_does: >-
      Natural conversational Hindi and Hinglish pass. Code-switching is allowed when
      both the chosen words and the way they are mixed sound natural to a native
      speaker. Judge language use only, not the factual or task correctness of the
      response.
    ai_likely_does: >-
      Flag any language that would sound odd to a native Hindi speaker, including
      translated-sounding phrasing, incorrect verb forms or core grammar, unnatural
      word choice, awkward code-switching, or overly formal or bookish Hindi for a
      spoken customer-service call.
  - factor_id: request_politeness
    enabled: false
    nuance: Polite requests to the customer
    question: Did the agent give the customer a blunt command instead of making a
      polite request?
    native_does: Makes requests with a polite verb form or a simple softener. Examples
      are "अपना ID बताइए", "ज़रा फिर से बोलिए", "क्या आप reason बता सकते हैं?",
      and "कृपया हाँ कहकर confirm कर दीजिए". One polite form is enough; every request
      does not need ज़रा, कृपया, and जी.
    ai_likely_does: Gives the customer a bare or blunt command. Examples are "ID दो",
      "reason बोलो", "फिर से कहो", and "हाँ बोलो". A line that lands as brusque or
      dismissive also counts even when polite verb forms are used - reassurance
      phrased as a command (a bare "शांत रहें" that lands as "be quiet"), or rushing
      the customer with "बताइए, हो गया?" without giving them time to comply. One
      clearly brusque line is enough. Judge how the request is framed here; pronoun
      choice and agreement with आप are separate criteria.
  # Added 2026-08-19 (factor-parity review vs ko/zh): Hindi's counting gap is
  # the Indian number scale, not classifiers. Scoped to large numbers/amounts.
  - factor_id: counting_units
    enabled: false
    nuance: Indian number scale (लाख/करोड़)
    question: When the agent said a large number or amount, did it use the Indian
      number scale and natural Hindi number forms?
    native_does: Uses लाख and करोड़ for large amounts. Examples are "डेढ़ लाख
      रुपये", "पाँच लाख", and "दो करोड़". Native fraction words such as डेढ़,
      ढाई, and सवा are natural, and हज़ार amounts such as "पचास हज़ार" are
      fine.
    ai_likely_does: Uses the Western scale or an English calque where Hindi
      uses the Indian scale. Examples are "दस मिलियन" or "million रुपये"
      instead of "एक करोड़", "पाँच सौ हज़ार" instead of "पाँच लाख", and "एक
      पॉइंट पाँच लाख" instead of "डेढ़ लाख". Currency-unit errors also count
      here - stating an amount in a currency other than the one on the record
      or in the conversation, such as saying dollars or pounds for a rupee
      amount, or switching currency units mid-call without reason. Do not flag
      English digits in codes, flight numbers, times, or dates, small numbers,
      or an amount the customer stated in millions that the agent merely
      echoed.
  - factor_id: name_address_conventions
    nuance: Name plus जी and honorific-consistent address
    question: When the agent addressed the customer by name, did it attach जी or
      an equivalent honorific the way a Hindi service agent would?
    native_does: Attaches जी to the name for a formal caller, such as "शर्मा जी"
      or "राहुल जी", or uses honorific address without a name, such as "सर" or
      "मैडम". The bare first name is fine in a clearly informal call, and
      addressing the customer without any name is fine. If the agent never uses
      the customer's name, there is no opportunity.
    ai_likely_does: Keeps addressing a formal caller by the bare first name where
      a native attaches जी or says सर or मैडम, or uses a bookish form such as
      "श्रीमान राहुल" in ordinary speech. Flag only habitual bare-name address;
      one bare mention of the recorded name while confirming account details is
      fine. Do not require name use or infer gender from a name. Judge verb
      agreement with आप under the honorific-agreement criterion and आप versus
      तुम under the register criterion.
  enabled_deterministic_factors: []
  email_symbols:
    '@':
    - at the rate
    - एट द रेट
    .:
