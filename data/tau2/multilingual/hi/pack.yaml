# --- delivery scoring (audio-layer) ---
# judge_factors select from the closed catalog in tau2.multilingual.delivery_catalog;
# factor_id must exist there (the loader rejects unknown ids).
delivery:
  judge_factors:
  - factor_id: regional_accent_consistency
    listen_for: Pronunciation that repeatedly conflicts with standard urban
      Hindustani or audibly switches between incompatible systems within the
      call — a heavy regional accent taking over the call, or an
      English-accented rendering of Hindi words in otherwise Hindi speech.
      English insertions natural to Hinglish are pronounced the Indian-English
      way; accept ordinary speaker variation and the normal urban range, and
      judge against standard urban Hindustani, not one preferred regional
      accent.

