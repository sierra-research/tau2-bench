# Locale identity corpus for pt (Brazil — the pack is pinned to Brazilian
# Portuguese, São Paulo / Rio personas) — reviewed raw material for the
# `tau2 factory localize-entities` step. All values are Latin (native ==
# romanized; accents are fine — user_ids/emails strip them: João -> joao);
# the generator draws deterministically per caller (seeded by the original
# user_id, gender inherited from the English caller's given name) and
# preserves the numeric suffix for user_id uniqueness. zip_format is the
# Brazilian CEP.
country: BRA
phone_number_format: "(11) 9####-####"
email_domain: example.com
zip_format: "#####-###"
address_format:
  city_region: "{city}, {region}"
  city_country: "{city}, {region}, {country}"
address_review:
  source: "reviewed localization corpus (updated 2026-08-03)"
  status: annotator_feedback_applied

