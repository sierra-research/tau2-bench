domains:
  airline:
    regional_bundle_file: regional/airline.json
    revision: voice-v2-frozen50-v1
    task_metadata_file: airline_metadata_pt.json
    voice_guidelines: '## LANGUAGE LOCALIZATION (Portuguese)


      ### Dates and numbers — one language only

      Say every date and number ENTIRELY in Portuguese. Never mix English and Portuguese
      words inside one date or number — the whole value is voiced in Portuguese, not
      half in each language.

      Native readouts:

      - ''05/08'' → “cinco de agosto”

      - ''May 17'' → “dezessete de maio”

      - ''14h30'' → “quatorze e trinta”

      - ''12/25'' → “vinte e cinco de dezembro”

      - ''21'' → “vinte e um”

      - ''R$ 50,90'' → “cinquenta reais e noventa centavos”

      - ''1.250'' → “mil duzentos e cinquenta”

      - ''3h'' → “três horas”


      ### Phone numbers

      Brazilian style: read the DDD (2-digit area code) first as a two-digit number
      or digit-by-digit, then the subscriber number in chunks. For a mobile number
      the prefix nine and the first block are read together, then the last four digits,
      all digit-by-digit separated by comma. Digits are always spoken one by one (never
      grouped into large numbers), and zero is ''zero'', never ''oh''. The digit 6
      is very commonly spoken as ''meia'' (from ''meia dúzia'', half a dozen) as well
      as ''seis''.

      Native readouts:

      - ''(11) 91234-5678'' → “onze, nove, um, dois, três, quatro, cinco, seis, sete,
      oito”

      - ''(21) 98765-4321'' → “vinte e um, nove, oito, sete, seis, cinco, quatro,
      três, dois, um”

      - ''+55 11 3040-5060'' → “mais cinco, cinco, onze, três, zero, quatro, zero,
      cinco, zero, seis, zero”


      ### Amounts and prices

      Currency word comes after the number: ''R$ 50'' -> ''cinquenta reais''. The
      decimal part after the comma (''vírgula'') is read as centavos: ''R$ 12,90''
      -> ''doze reais e noventa centavos''. The thousands separator is a dot and is
      not voiced as a word; large amounts use ''mil'' and ''milhão/milhões''.

      Native readouts:

      - ''R$ 50'' → “cinquenta reais”

      - ''R$ 253,00'' → “duzentos e cinquenta e três reais”

      - ''R$ 12,90'' → “doze reais e noventa centavos”

      - ''R$ 1.250,50'' → “mil duzentos e cinquenta reais e cinquenta centavos”


      ### Spelling and anchors only on request

      Spell a name, ID, email, or code character by character only when the agent
      explicitly asks you to spell it. A request to repeat a value or a failed lookup
      is not a request to spell it. Add word anchors or character explanations only
      when the agent specifically asks for anchors or explanations; a spelling request
      alone does not request anchors.

      Use the following locale examples only after the agent specifically requests
      anchors or character explanations:

      - ''A'' → “A de Amélia”

      - ''B'' → “B de Bola”

      - ''C'' → “C de Casa”

      - ''D'' → “D de Dado”

      - ''R'' → “R de Roberto”



      ### Domain terms — say them in Portuguese

      Use these natural Portuguese terms for the service vocabulary below; do not
      switch into the English term mid-sentence. Where a note marks the English form
      as the established native usage, that form IS the natural term. If your persona''s
      register genuinely code-switches a term, the persona instructions take precedence.

      - user ID → “ID de usuário” (in casual register also ''login'' or ''usuário'')

      - reservation → “reserva”

      - reservation ID → “código da reserva” (also ''localizador'')

      - flight → “voo”

      - flight number → “número do voo”

      - refund → “reembolso” (in casual Carioca register the English ''refund'' is
      also heard)

      - travel insurance → “seguro viagem”

      - checked bag → “bagagem despachada”

      - carry-on bag → “bagagem de mão”

      - future trip → “viagem futura”

      - one-way trip → “só ida”

      - round trip → “ida e volta”

      - basic economy → “econômica básica” (in casual register also ''basic economy'')

      - economy → “classe econômica” (casual: ''econômica'')

      - business class → “classe executiva” (in casual register also ''business'')

      - credit card → “cartão de crédito”

      - gift card → “gift card” (formal register also ''cartão-presente'')

      - travel certificate → “voucher de viagem” (''voucher'' is the naturalized term
      used in everyday speech)

      - membership tier → “categoria de fidelidade” (also ''nível do programa de milhas'')

      - cancellation → “cancelamento”

      - payment method → “forma de pagamento”'
    text_guidelines: '## LANGUAGE LOCALIZATION (Portuguese)


