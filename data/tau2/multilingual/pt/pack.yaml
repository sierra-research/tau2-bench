# all previously-reviewed fields preserved verbatim.
# Symbols and term_ids select from the closed catalogs in
# tau2.multilingual.localization_catalog (the loader rejects unknown ids).
localization:
  symbol_readouts:
  - symbol: '@'
    spoken:
    - arroba
  - symbol: .
    spoken:
    - ponto
  - symbol: _
    spoken:
    - underline
    - sublinhado
    - traço baixo
  - symbol: '-'
    spoken:
    - hífen
    - traço
  - symbol: /
    spoken:
    - barra
  - symbol: +
    spoken:
    - mais
  - symbol: '0'
    spoken:
