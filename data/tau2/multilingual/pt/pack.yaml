translation_guidance: 'Target language: BRAZILIAN Portuguese (pt_BR), NOT European
  Portuguese. Use Brazilian vocabulary and forms throughout: ''você''/''a gente''
  (not ''tu''/''vós'' for the standard register), ''celular'' (not ''telemóvel''),
  ''ônibus'' (not ''autocarro''), ''trem'', ''tela'' (not ''ecrã''), ''time'' (not
  ''equipa''), ''legal''/''massa'', ''cadastro'', ''arquivo'', ''CEP'', ''CPF''. Brazilian
  spelling anchors: ''fato'' (not ''facto''), ''ação'', ''econômico'' (not ''económico''),
  ''gerenciar'', ''caminhão'', ''registro'' (not ''registo''). Avoid any European
  Portuguese word, spelling or pronunciation.


  REGISTER:

  - Two registers coexist in this pack. Ricardo = polished formal: ''o senhor''/''a
  senhora'', ''por gentileza'', ''pois não'', ''fico no aguardo'', full sentences,
  no slang, no English. Juliana = casual carioca: ''você'', ''a gente'', ''beleza'',
  ''tranquilo'', ''massa'', ''rapidinho'', plus light English tech terms. Match the
  register of the persona/turn you are translating — do NOT flatten both into a neutral
  middle.


  LOANWORD / CODE-SWITCHING POLICY:

  - For the informal register, common English tech/everyday terms are the INTENDED
  voice and stay verbatim in Latin script inline: app, link, login, status,
  e-mail, site. Do NOT ''purify'' these into stiff equivalents (e.g. do not force
  ''app'' -> ''aplicativo'' when the slangy ''app'' is intended, do not force ''link''
  -> ''hiperligação''). Portuguese remains the matrix language; English words are
  insertions.

  - ''check'' as a bare English noun is NOT natural Brazilian Portuguese: never
  ''dar um check'' or ''tem algum check''. For checking/verifying, use ''dar uma
  conferida'', ''dar uma olhada'', ''pode conferir'', ''confirmar'', or the
  naturalized verb ''checar'' (''pode checar para mim'').

  - For the formal register (Ricardo), AVOID English insertions: prefer ''aplicativo'',
  ''comprovante'', ''cadastro'' over English. Keep it clean Portuguese.


  FALSE FRIENDS (translate the MEANING, very common traps):

  - ''actually'' -> ''na verdade'' / ''na realidade'', NEVER ''atualmente'' (which
  means ''currently'').

  - ''eventually'' -> ''no fim'' / ''mais cedo ou mais tarde'', NEVER ''eventualmente''
  (which means ''occasionally/possibly'').

  - ''to realize'' -> ''perceber'' / ''dar-se conta'', NOT ''realizar'' (which means
  ''to carry out'').

  - ''to push'' (a button) -> ''apertar'' / ''clicar'', not ''empurrar''.

  - ''to support'' (help) -> ''dar suporte'' / ''atender'', be careful with ''suportar''
  (= to tolerate/endure).


  CALQUE TRAPS (translate the meaning, not the words):

  - ''as soon as possible'' -> ''o quanto antes'' / ''assim que possível'', not a
  literal ''tão cedo quanto possível''.

  - ''make sure that'' -> ''certifique-se de que'' / ''veja se'', not a word-for-word
  string.

  - ''if and only if'' -> ''somente se'' / ''apenas quando'', not a stiff calque.

  - ''I look forward to'' -> ''fico no aguardo'' / ''aguardo'', never a literal rendering.

  - Conditionals: keep trigger and consequence aligned — ''se ... então ...'' / ''se
  ..., ...'' must map the English if/then exactly; never drop the consequence.


  GENDER:

  - Portuguese inflects adjectives, participles and some nouns for the speaker''s
  gender (obrigado/obrigada, pronto/pronta, ele mesmo/ela mesma). The unmarked/DEFAULT
  form for first-person speaker prose is masculine (e.g. ''eu mesmo'', ''estou pronto'',
  ''obrigado''). Write the prose in this default; do NOT bake a specific gender into
  the task prose. The speaker''s actual gender is injected at runtime via the voice
  persona.

  - The unmarked/default (masculine) form is CORRECT and intended: using it is never
  a meaning, naturalness, or register problem, and forced masculine agreement is never
  a meaning difference. The ONLY gender defect is INCONSISTENCY within one text —
  e.g. ''estou pronto'' in one clause and ''obrigada'' in the next for the same speaker.


  SCRIPT / NUMBER CONVENTIONS:

  - All concrete values — ids, codes, amounts, dates, reservation/flight numbers,
  CPF, CEP — stay verbatim with Latin digits (1, 2, 3). The VALUE is verbatim; an
  attached unit/word localizes (e.g. ''3h'' -> ''3 horas'', keep the digit, translate
  the unit).

  - Decimals use a COMMA (''vírgula''): 3,50 read as ''três e cinquenta'' or ''três
  vírgula cinquenta''. Thousands use a DOT: 1.250 -> ''mil duzentos e cinquenta''.

  - Currency: ''R$ 50'' -> ''cinquenta reais''; ''R$ 50,90'' -> ''cinquenta reais
  e noventa centavos''.

  - ''@'' is read ''arroba''; ''joao@gmail.com'' -> ''joão arroba gmail ponto com''.
  TLDs: ''.com'' -> ''ponto com''; ''.com.br'' -> ''ponto com bê-érre''.

  - Letters/codes spelled with Brazilian letter names: A ''á'', B ''bê'', C ''cê'',
  D ''dê'', E ''é'', F ''éfe'', G ''gê'', H ''agá'', I ''i'', J ''jota'', K ''cá'',
  L ''éle'', M ''ême'', N ''êne'', O ''ó'', P ''pê'', Q ''quê'', R ''érre'', S ''ésse'',
  T ''tê'', U ''u'', V ''vê'', W ''dáblio'', X ''xis'', Y ''ípsilon'', Z ''zê''. So
  ''BR4K9'' -> ''bê, érre, quatro, cá, nove''.

  - Phone numbers chunked Brazilian style with DDD: (11) 91234-5678 -> ''onze, nove
  um dois três quatro, cinco seis sete oito''.

  - Dates day-first: 05/08 -> ''cinco de agosto''. 24h clock common: ''14h30'' ->
  ''quatorze e trinta'' / ''duas e meia da tarde''.


  REGISTER EXAMPLES (natural target):

  - Formal (Ricardo): ''Boa tarde, o senhor poderia, por gentileza, verificar minha
  conta?''

  - Formal: ''Compreendo perfeitamente, fico no aguardo.''

  - Casual (Juliana): ''Oi, beleza? Então, a gente tá com um probleminha no app.''

  - Casual: ''Relaxa que é tranquilo, deixa eu dar uma conferida rapidinho no seu cadastro.'''
agent_greeting: Olá! Como posso ajudar?
guidelines_voice_path: guidelines/simulation_guidelines_voice_pt.md

# --- nativeness scoring ---
# judge_factors select from the closed catalog in tau2.multilingual.nativeness_catalog;
# factor_id must exist there (the loader rejects unknown ids). email_symbols
# are native verbalizations of email symbols for the deterministic checker.
nativeness:
  judge_factors:
  - factor_id: register_formality
    nuance: Natural Brazilian customer address
    question: Did the agent keep a natural and internally consistent way of addressing
      the customer?
    native_does: Uses você, o senhor/a senhora, or a locally natural tu pattern and
      keeps the relationship consistent. Examples are "Você pode confirmar seu nome?"
      and "A senhora poderia me informar o código?". Brazilian speakers often use você
      with te, so that alone is not an error.
    ai_likely_does: Abruptly switches between socially incompatible forms or uses a verb
      form that clearly does not fit the chosen address. An example is starting with "O
      senhor poderia confirmar?" and then switching to "tu me diz aí" without a reason.
      Do not flag tu merely because it appears; natural Brazilian regional usage is fine.
  - factor_id: regional_consistency
    nuance: Brazilian rather than European Portuguese
    question: Did the agent consistently use Brazilian-Portuguese grammar and
      vocabulary?
    native_does: Uses ordinary Brazilian forms such as "estou verificando", "celular",
      and "arquivo". Formal Brazilian Portuguese and natural regional variation are
      both fine.
    ai_likely_does: Uses unmistakably European forms such as "estou a verificar",
      "telemóvel", or "ficheiro", or repeatedly drifts into European grammar and
      vocabulary. Do not flag one formal construction or a word shared by both varieties.
  # In colloquial Brazilian Portuguese, a female speaker may use "obrigado" as
  # an interjection-like fixed expression; that form alone is not a violation.
  - factor_id: gender_agreement
    nuance: Gender agreement in one utterance
    question: Did articles, adjectives, participles, noun phrases, gendered numbers,
      and references to known people use the correct gender?
    native_does: Catch three subtypes of agreement. (1) Agent self-reference — a
      known female agent uses feminine forms for herself, such as "atenciosa" or
      "sou uma assistente". A known male agent says "obrigado". A female speaker
      may say "obrigada" or "obrigado"; colloquial Portuguese treats "obrigado" as
      a fixed thanking token, so it is acceptable from any speaker. In a greeting
      or any utterance before the speakers' identities are known,
      masculine-inclusive language is the neutral default and is correct. (2)
      Addressing the customer — gendered words agree with the customer's known
      gender. Masculine plural for a mixed-gender group is correct — "vamos cuidar
      disso juntos" for a female agent and a male customer is right. (3) Noun and
      internal agreement — gender stays consistent inside the phrase and with the
      actual referent, as in "a mala despachada", "duas passagens", and "duzentas
      milhas". Resolve the referent before judging a pronoun or participle. The set
      phrase "um ida e volta", meaning "um bilhete de ida e volta", is also fine.
    ai_likely_does: (1) Self-reference — a known female agent uses masculine forms
      for herself, such as "agente automatizado" or "o mais atencioso possível", or
      "obrigada" comes from a known male speaker. Spoken slash-alternatives are
      always a violation regardless of gender — saying "obrigado/a" aloud is wrong
      on its face; the speaker must commit to one form. (2) Customer-directed —
      senhor for a known female customer, senhora for a known male customer, or a
      feminine plural that includes a known male customer, such as "vamos cuidar
      disso juntas". (3) Noun agreement — a clearly conflicting form with the
      actual referent, such as "a passageiro", "o mala despachada", "dois
      passagens", or "duzentos milhas". One clear error is enough. Do not flag
      "obrigado" from a female speaker. Never infer missing gender from a name. Do
      not flag likely transcription errors. Judge only clear agreement errors —
      word-for-word English calques and awkward-but-agreeing phrasing belong to
      other criteria, not here.
  - factor_id: natural_word_choice
    nuance: Combined utterance naturalness for Brazilian Portuguese
    question: >-
      This is a customer-service call in Brazilian Portuguese. Does this utterance
      contain any translationese, verb-morphology or basic function-word error, or
      unnatural word choice?
    native_does: >-
      Natural conversational Brazilian Portuguese passes, whether colloquial or
      ordinarily formal for customer service. English words are allowed when they are
      established in Brazilian usage or are literal names, product, interface, or
      status labels, or identifiers and are integrated naturally. Judge language use
      only, not factual or task correctness.
    ai_likely_does: >-
      Flag any language that would sound odd to a native Brazilian-Portuguese speaker,
      including English-shaped phrasing, incorrect verb person or mood, wrong or
      missing basic articles or prepositions, unnatural word choice, or avoidable
      English that a Brazilian speaker would not normally use in this context.
  - factor_id: request_politeness
    enabled: false
    nuance: Request softening / politeness routines
    question: Did the agent make requests with a natural level of politeness for a
      service call?
    native_does: Uses a polite question, conditional, or simple softener. Examples are
      "O senhor poderia confirmar, por favor?", "Pode me informar o número, por
      gentileza?", and "Quando puder, me passa o CEP?". A direct request can still be
      polite; one polite softener suffices, and every request does not need several.
    ai_likely_does: Repeatedly gives the customer bare commands such as "Me dá seu
      número" or "Confirma agora" where a softened request is expected. Judge the
      force of the request here; the choice between você and o senhor belongs to the
      register criterion.
  - factor_id: counting_units
    nuance: Brazilian number scale and decimal reading
    question: When the agent said a large number, an amount, or a decimal, did it
      use the Brazilian number scale and reading?
    native_does: Uses the Brazilian short scale and the decimal vírgula. Examples
      are "um bilhão de reais" for the English billion, "quinhentos mil", "dois
      vírgula cinco" for 2.5, and "cinquenta reais e noventa centavos". "Bilhão"
      is the correct Brazilian word for a thousand millions; do not flag it.
    ai_likely_does: Reads a number on the European-Portuguese scale or with an
      English decimal point. Examples are "mil milhões" instead of "um bilhão",
      "quinhentos milhares" instead of "quinhentos mil", and "dois ponto cinco"
      instead of "dois vírgula cinco". Currency-unit errors also count here -
      stating an amount in a currency other than the one on the record or in the
      conversation, such as dollars for a reais amount, or garbling the currency
      reading of an amount. Do not flag "ponto" in emails or websites
      such as "ponto com", digits read one by one in codes or phone numbers, or a
      figure the customer said that the agent merely echoed.
  - factor_id: name_address_conventions
    enabled: false
    nuance: Brazilian name and title address
    question: When the agent addressed the customer by name, did it pair the name
      and title the way a Brazilian would?
    native_does: Attaches senhor or senhora to the FIRST name in formal address,
      the Brazilian convention, and uses the bare first name casually. Examples
      are "o senhor João", "a senhora Maria, pode confirmar?", and "Tá bom, João"
      in a casual call. Senhor with the surname, such as "senhor Silva", is also
      acceptable formal usage, and addressing the customer without any name is
      fine. If the agent never uses the customer's name, there is no opportunity.
    ai_likely_does: Addresses the customer by surname alone, such as "Silva, pode
      confirmar?", or keeps addressing the customer with the full name, such as
      "João Silva" in turn after turn, where a Brazilian says "o senhor João" or
      just "João". Do not require name use or infer gender from a name. Judge the
      choice between você and o senhor under the register criterion and a
      wrong-gender senhor or senhora under the gender-agreement criterion.
  enabled_deterministic_factors:
  - email_symbol_verbalization
  email_symbols:
    '@':
    - arroba
    .:
    - ponto

# --- delivery scoring (audio-layer) ---
# judge_factors select from the closed catalog in tau2.multilingual.delivery_catalog;
# factor_id must exist there (the loader rejects unknown ids). Rubrics are grounded
# in confirmed human-annotation findings (docs/multilingual/annotation/nuance_map.json).
delivery:
  judge_factors:
  - factor_id: regional_accent_consistency
    listen_for: Pronunciation that repeatedly conflicts with mainstream Brazilian
      Portuguese or audibly switches between incompatible systems within the
      call — European-Portuguese vowel reduction and prosody, or an
      English-accented rendering of Portuguese words. Either São Paulo or Rio
      mainstream pronunciation is fine; accept ordinary speaker variation and
      judge against the Brazilian pin, not one preferred city accent.

