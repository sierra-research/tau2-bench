language: pt
display_name: Portuguese
backchannel_level: medium  # density knob (tau2.backchannel)
agent_language_clause: Respond in Portuguese using Latin script for Portuguese and
  Latin script for English insertions; mirror the user's code-switching register;
  keep all tool calls, arguments, and structured outputs in English exactly as specified.
  The customer database stores every name and address without accents or diacritics
  (e.g. 'Joao Simoes', never 'João Simões'); spell database values in tool-call
  arguments in plain unaccented letters. It stores every CEP in the hyphenated
  Brazilian form, five digits then a hyphen then three (e.g. '81854-816', never
  '81854816'); write the hyphen in tool-call arguments whether or not the customer
  says it, both when looking a customer up and when saving an address.
default_out_of_turn_events_per_minute: 1.0
