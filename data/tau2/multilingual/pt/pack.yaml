  phone_number_readout:
    rule: 'Brazilian style: read the DDD (2-digit area code) first as a two-digit
      number or digit-by-digit, then the subscriber number in chunks. For a mobile
      number the prefix nine and the first block are read together, then the last
      four digits, all digit-by-digit separated by comma. Digits are always spoken
      one by one (never grouped into large numbers), and zero is ''zero'', never ''oh''.
      The digit 6 is very commonly spoken as ''meia'' (from ''meia dúzia'', half a
      dozen) as well as ''seis''.'
    examples:
    - written: (11) 91234-5678
      spoken: onze, nove, um, dois, três, quatro, cinco, seis, sete, oito
    - written: (21) 98765-4321
      spoken: vinte e um, nove, oito, sete, seis, cinco, quatro, três, dois, um
    - written: +55 11 3040-5060
      spoken: mais cinco, cinco, onze, três, zero, quatro, zero, cinco, zero, seis,
        zero
  amount_readout:
    rule: 'Currency word comes after the number: ''R$ 50'' -> ''cinquenta reais''.
      The decimal part after the comma (''vírgula'') is read as centavos: ''R$ 12,90''
      -> ''doze reais e noventa centavos''. The thousands separator is a dot and is
      not voiced as a word; large amounts use ''mil'' and ''milhão/milhões''.'
    examples:
    - written: R$ 50
      spoken: cinquenta reais
    - written: R$ 253,00
      spoken: duzentos e cinquenta e três reais
    - written: R$ 12,90
      spoken: doze reais e noventa centavos
    - written: R$ 1.250,50
      spoken: mil duzentos e cinquenta reais e cinquenta centavos
  spelling_alphabet:
    rule: 'Spell with the Brazilian phone alphabet using common Brazilian given names
      and everyday words as anchors: ''A de Amélia'', ''B de Bola'', ''R de Roberto''.
      Letters use Brazilian letter names (bê, cê, dê, agá, jota, érre, ésse). Read
      code digits one by one with the digit words.'
    avoid: The NATO/international anglo alphabet ('A for Alpha', 'B for Bravo', 'C
      for Charlie') — a Brazilian does not use it on the phone.
    anchor_examples:
    - written: A
      spoken: A de Amélia
    - written: B
      spoken: B de Bola
    - written: C
      spoken: C de Casa
    - written: D
      spoken: D de Dado
    - written: R
      spoken: R de Roberto
