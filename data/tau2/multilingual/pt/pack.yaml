    Z: zê
  # TTS-only respelling of the six letter names whose unstressed final -e the
  # voice renders European ("érrê", "élê", "ênê") instead of raising it to -i
  # the Brazilian way. Brazilian pronunciation raises these endings in F, L,
  # M, N, R, and S. Every other letter name is either
  # stressed on the final vowel (bê, cê, dê, gê, pê, tê, vê, zê, quê) or has
  # no final -e at all, so it is left alone. The transcript keeps the
  # orthographic forms in letter_names above.
  letter_name_tts:
    F: éfi
    L: éli
    M: êmi
    N: êni
    R: érri
    S: éssi
  digit_names:
    '0': zero
    '1': um
    '2': dois
    '3': três
    '4': quatro
    '5': cinco
    '6': seis
    '7': sete
    '8': oito
    '9': nove
# --- text input styles (closed catalog: tau2.multilingual.text_input_catalog) ---
# Applicability decision (docs/designs/text-mode-multilingual.md): typing
# without accents/cedilla is routine in informal Brazilian Portuguese chat.
# Examples are persona-neutral typing MECHANICS only.
text_input:
  styles:
  - style: diacritic_free
    examples:
    - standard: Não, você pode cancelar o voo de São Paulo
      typed: Nao, voce pode cancelar o voo de Sao Paulo
    - standard: A cobrança está errada
      typed: A cobranca esta errada
    - standard: Também quero mudar o horário
      typed: Tambem quero mudar o horario
