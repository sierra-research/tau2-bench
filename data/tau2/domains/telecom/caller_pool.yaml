# Reviewed English caller pool for the telecom multilingual seed set.
#
# `tau2 factory seed-tasks` assigns callers round-robin (task index % pool
# size) across the 114-task seed split, renaming customer C1001 per task via
# an initialization_data customers patch — customer_id, phone number, lines,
# and bills stay canonical. ORDER IS LOAD-BEARING: position i receives tasks
# i, i+25, i+50, ... (the first 14 positions get 5 tasks, the rest 4), and
# the gender layout below (5 female among the first 14, 8 after) makes the
# task-level gender split exactly 57/57.
#
# Constraints (enforced by CallerPool validators + tests):
# - full_name and email unique within the pool AND disjoint from every
#   db.toml customer (John Smith, Sarah Johnson, Michael Lee, Emma Wilson);
# - given name present in GIVEN_NAME_GENDERS and agreeing with `gender`;
# - date_of_birth a real calendar date (YYYY-MM-DD) in the adult range.
