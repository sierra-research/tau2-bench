# Email PATTERN bank (owner-linked emails, design doc section 4).
#
# Entries are local-part patterns instantiated with the drawn owner's
# name ({first}/{last} = ASCII-folded lowercase name tokens, {f}/{l} =
# initials), so a callee's email always reads as their own. Easy =
# firstname.lastname shapes at major fictional domains; hard =
# symbol-dense local parts (dots, underscores, hyphens, digits,
# initials) at obscure fictional domains. Decoys reuse the same owner:
# easy decoys differ by domain, hard decoys differ only by a separator
# in the local part -- which is why the published email fold rule
# (section 7) folds case ONLY and preserves separators.
# Extended 2026-08-24 for the 40/40 flat bank contract.
entity: emails
entries:
