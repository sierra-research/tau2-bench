# Oddball-token pronunciation table (design doc sec. 8).
#
# One entry per non-ignored TTS-risk token mechanically extracted from the
# invented-content banks (coined, insurance_plans, rate_plans, shops,
# addresses, vehicles, properties; values AND decoys) by the fixed in-code
# extractor in tau2.domains.intake.tasks.token_pronunciations. The
# respelling DEFINES the canonical pronunciation of each invented or
# convention-bound token (it pins the reading rather than recording one);
# letter-digit-mix tokens are excluded by owner decision EXCEPT the
# owner-graduated leet coinages and trim codes in GRADUATED_LETTER_DIGIT
# (packet review 2026-08-26), which appear here as class letter_digit; the
# token packet lists the remaining letter-digit tokens as ignored). Loading
# validates exact extractor <-> table alignment: every extracted token has
# exactly one entry, no orphans, ASCII only, class recorded.
