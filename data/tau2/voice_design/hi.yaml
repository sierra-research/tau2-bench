# ElevenLabs Voice Design inputs for the hi pack caller personas.
#
# The voice IDs in data/tau2/multilingual/hi/pack.yaml are Sierra-internal.
# `python -m tau2.voice.scripts.setup_voices --language hi` designs your own
# voices from these prompts. This file is not part of any benchmark pin.
language: hi
personas:
  rishika_hindi_v1:
    gender: female
    model: eleven_ttv_v3
    prompt: A woman in her late 20s from Mumbai, an IT professional calling customer
      support from her mobile phone, often from traffic or a busy office. A native
      Hindi speaker who talks in fast, fluent Hinglish — Hindi sentences with frequent
      English words for work and tech terms, both pronounced naturally in an urban
      Indian accent. Medium-high pitch, crisp and confident delivery, matter-of-fact
      and slightly hurried, with quick conversational rhythm and short pauses. Mobile
      phone-call audio quality with faint ambient room tone.
    audition_text: तो, मैं अगले महीने अपनी बहन से मिलने फ्लाइट से जा रही हूँ, और अभी-अभी
      पता चला कि मेरा वर्क शेड्यूल बदल गया है। मैं सोच रही थी कि क्या मेरी फ्लाइट
      दो-तीन दिन आगे कर सकते हैं, बेहतर होगा अगर शाम की हो। और मैं ये भी चेक करना
      चाहूँगी कि मेरी सीट में अभी भी एक्स्ट्रा लेगरूम है या नहीं, क्योंकि आजकल मेरे
      घुटने में थोड़ी दिक्कत चल रही है। ओह, और पिछली बार मील ऑप्शन कन्फर्म नहीं हुआ
      था, तो अगर आप वो भी डबल-चेक कर दें, तो बहुत अच्छा होगा। सच कहूँ तो, मैं बस चाहती
      हूँ कि सब कुछ सेट हो जाए, ताकि इसकी टेंशन लेना बंद कर सकूँ।
  imran_hindi_v1:
    gender: male
    model: eleven_ttv_v3
    prompt: A man in his mid-50s from Old Delhi, a small-business owner (shopkeeper)
      calling customer support from his shop. He speaks unhurried, courteous Urdu-inflected
      Hindi (Hindustani) with Persian-Urdu vocabulary — soft consonants, gentle nasalization
      — and only occasional English words for numbers and brand names, pronounced
      with a strong North-Indian accent. Lower pitch, warm but firm slightly gravelly
      timbre, measured pacing with deliberate pauses, polite and formal register that
      stays composed even when insistent. Phone-call audio quality with quiet household/shop
      room tone.
    audition_text: तो, मैं अगले महीने अपनी बहन से मिलने फ्लाइट से जा रहा हूँ, और अभी-अभी
      पता चला कि मेरा वर्क शेड्यूल बदल गया है। मैं सोच रहा था कि क्या मेरी फ्लाइट
      दो-तीन दिन आगे कर सकते हैं, बेहतर होगा अगर शाम की हो। और मैं ये भी चेक करना
      चाहूँगा कि मेरी सीट में अभी भी एक्स्ट्रा लेगरूम है या नहीं, क्योंकि आजकल मेरे
      घुटने में थोड़ी दिक्कत चल रही है। ओह, और पिछली बार मील ऑप्शन कन्फर्म नहीं हुआ
      था, तो अगर आप वो भी डबल-चेक कर दें, तो बहुत अच्छा होगा। सच कहूँ तो, मैं बस चाहता
      हूँ कि सब कुछ सेट हो जाए, ताकि इसकी टेंशन लेना बंद कर सकूँ।
