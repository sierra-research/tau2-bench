# ElevenLabs Voice Design inputs for the pt pack caller personas.
#
# The voice IDs in data/tau2/multilingual/pt/pack.yaml are Sierra-internal.
# `python -m tau2.voice.scripts.setup_voices --language pt` designs your own
# voices from these prompts. This file is not part of any benchmark pin.
language: pt
personas:
  ricardo_pt_v1:
    gender: male
    model: eleven_ttv_v3
    prompt: A middle-aged man in his early 50s from São Paulo with a deep, unmistakably
      masculine male voice, a senior bank account manager calling from a quiet office.
      He speaks polished, formal Brazilian Portuguese (paulistano accent) with careful
      enunciation, no slang and essentially no English. Low masculine pitch, warm
      but composed and authoritative baritone timbre, natural flowing conversational
      pacing — measured but never sluggish — with very clear articulation especially
      when reading numbers and codes. Recorded close to the microphone with studio
      clarity — a full, present, crisp voice with no distance, muffling or room echo.
    audition_text: Então, mês que vem eu vou viajar de avião pra visitar minha irmã,
      e acabei de descobrir que meu horário de trabalho mudou. Eu queria ver se dá
      pra empurrar meu voo uns dois ou três dias, de preferência à noite. Também queria
      confirmar se meu assento ainda tem espaço extra pras pernas, porque meu joelho
      anda me incomodando ultimamente. Ah, e da última vez a opção de refeição não
      ficou confirmada, então se você puder dar uma conferida nisso também, seria
      ótimo. Sinceramente, eu só quero deixar tudo resolvido pra parar de me preocupar
      com isso.
  juliana_pt_v1:
    gender: female
    model: eleven_ttv_v3
    prompt: A woman in her late 20s from Rio de Janeiro, a delivery-app support agent
      calling from a busy open-plan office or sometimes the street. She speaks fast,
      warm, informal carioca Brazilian Portuguese with the characteristic chiado,
      lots of slang and occasional English tech words (app, link, check), pronounced
      naturally. Medium-high pitch, lively and friendly delivery, quick conversational
      rhythm with frequent backchannels and short pauses, an easygoing upbeat tone.
      Mobile phone-call audio quality with faint ambient street/office noise.
    audition_text: Então, mês que vem eu vou viajar de avião pra visitar minha irmã,
      e acabei de descobrir que meu horário de trabalho mudou. Eu queria ver se dá
      pra empurrar meu voo uns dois ou três dias, de preferência à noite. Também queria
      confirmar se meu assento ainda tem espaço extra pras pernas, porque meu joelho
      anda me incomodando ultimamente. Ah, e da última vez a opção de refeição não
      ficou confirmada, então se você puder dar uma conferida nisso também, seria
      ótimo. Sinceramente, eu só quero deixar tudo resolvido pra parar de me preocupar
      com isso.
