# ElevenLabs Voice Design inputs for the zh pack caller personas.
#
# The voice IDs in data/tau2/multilingual/zh/pack.yaml are Sierra-internal.
# `python -m tau2.voice.scripts.setup_voices --language zh` designs your own
# voices from these prompts. This file is not part of any benchmark pin.
language: zh
personas:
  jianguo_zh_v1:
    gender: male
    model: eleven_ttv_v3
    prompt: A man in his mid-50s from Beijing, a retired civil-service section chief
      now serving on his residential committee, calling customer support from a quiet
      home study. He speaks clean, standard broadcast Putonghua with a polished northern
      accent — crisp retroflex zh/ch/sh/r and natural erhua — in complete, grammatical
      sentences, with almost no English. Lower pitch, warm but authoritative slightly
      resonant timbre, measured pacing with deliberate pauses, polite and formal register
      that stays composed even when insistent. Phone-call audio quality with a quiet
      indoor household room tone.
    audition_text: 你好，我下个月要飞去看我姐姐，然后我刚发现我的工作排班改了。我想把航班往后改个两天，最好是晚上的。另外我也想确认一下，我的座位是不是还有加大腿部空间，因为我最近膝盖有点不太舒服。哦对了，上次我的餐食选项好像没弄成功，所以如果你能帮我再确认一下就太好了。说实话，我就是想在放心之前把这些都处理好。
  xiaomeng_zh_v1:
    gender: female
    model: eleven_ttv_v3
    prompt: A woman in her mid-20s from Shanghai working in tech marketing, calling
      customer support from her mobile — often from a busy open-plan office, the street,
      or a café, sometimes on speakerphone while multitasking. A native Mandarin speaker
      with a southern Mainland accent — merged zh/z and sh/s, weak or absent erhua,
      lighter retroflex — who talks in fast, casual Chinese with frequent English
      tech and lifestyle words mixed in naturally. Medium-high pitch, quick energetic
      delivery, matter-of-fact and slightly hurried, with overlapping backchannels
      and short pauses. Mobile phone-call audio quality with ambient street/office
      noise and occasional speakerphone reverb.
    audition_text: 你好，我下个月要飞去看我姐姐，然后我刚发现我的工作排班改了。我想把航班往后改个两天，最好是晚上的。另外我也想确认一下，我的座位是不是还有加大腿部空间，因为我最近膝盖有点不太舒服。哦对了，上次我的餐食选项好像没弄成功，所以如果你能帮我再确认一下就太好了。说实话，我就是想在放心之前把这些都处理好。
