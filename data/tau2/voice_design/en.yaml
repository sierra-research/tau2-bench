# ElevenLabs Voice Design inputs for the en pack caller personas.
#
# The voice IDs in data/tau2/multilingual/en/pack.yaml are Sierra-internal.
# `python -m tau2.voice.scripts.setup_voices --language en` designs your own
# voices from these prompts. This file is not part of any benchmark pin.
language: en
personas:
  mamadou_diallo:
    gender: male
    model: eleven_ttv_v3
    prompt: A Senegalese man who's first language is french in his mid-30s calling
      customer service about a billing issue. He speaks English with a strong French
      accent. His tone is hurried, slightly annoyed, and matter-of-fact, as if he's
      been transferred between agents and just wants the problem fixed.
    audition_text: Hi, I'm calling about an issue with my account. I tried logging
      in earlier today but it keeps saying my password is wrong. I'm pretty sure I
      haven't changed it recently, so I'm not sure what's going on. Could you help
      me figure this out?
  priya_patil:
    gender: female
    model: eleven_ttv_v3
    prompt: A woman in her early 30s from Maharashtra, India, calling customer support
      from her mobile phone. She speaks Indian English with a strong Maharashtrian
      accent — noticeable regional intonation and rhythm. Her tone is slightly annoyed
      and hurried, matter-of-fact, and focused on getting the issue resolved quickly.
      Her voice has medium pitch, firm delivery, short sentences, and faint background
      room tone typical of a phone call.
    audition_text: Hi, I'm calling about an issue with my account. I tried logging
      in earlier today but it keeps saying my password is wrong. I'm pretty sure I
      haven't changed it recently, so I'm not sure what's going on. Could you help
      me figure this out?
