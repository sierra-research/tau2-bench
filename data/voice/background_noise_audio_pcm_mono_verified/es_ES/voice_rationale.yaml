    voice_design_prompt: A man in his mid-50s from Madrid, a senior bank relationship
      manager calling from a quiet home office. He speaks careful, high-register Peninsular
      Spanish with full distinción (the /θ/ for c and z, so 'gracias' sounds like
      'grathias'), consistent use of 'usted', complete sentences and very few fillers.
      Lower pitch, warm but composed and slightly formal timbre, measured and deliberate
      pacing with clear pauses, courteous register that stays polite even when insistent.
      He enunciates numbers and booking codes slowly and confirms them back. Phone-call
      audio quality with a quiet indoor room tone.
    audition_text: Bueno, vuelo para ver a mi hermana el mes que viene y acabo de
      enterarme de que me cambiaron el horario en el trabajo. Quería ver si puedo
      mover mi vuelo a un par de días después, idealmente por la tarde-noche. También
      me gustaría comprobar si mi asiento sigue teniendo espacio extra para las piernas,
      porque últimamente la rodilla me está dando guerra. Ah, y la última vez no quedó
      registrada la opción de comida, así que si pudiera revisarlo también, sería
      genial. La verdad, solo quiero dejarlo todo arreglado para poder quedarme tranquilo.
