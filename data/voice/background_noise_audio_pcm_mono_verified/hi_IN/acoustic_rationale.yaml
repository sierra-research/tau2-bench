    broadcaster_script: नमस्कार, आप देख रहे हैं समाचार। आज की मुख्य ख़बरें इस प्रकार
      हैं। राजधानी दिल्ली में आज मौसम साफ़ रहा और तापमान सामान्य से थोड़ा अधिक दर्ज
