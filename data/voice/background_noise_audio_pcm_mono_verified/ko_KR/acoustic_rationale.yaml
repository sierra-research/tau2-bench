      커 건강 관리에 유의하셔야겠습니다. 금융시장에서는 주요 지수가 좁은 범위에서 움직이며 전반적으로 안정된 흐름을 보였습니다. 프로스포츠 경기에서는
      홈팀이 탄탄한 수비를 바탕으로 한 점 차 승리를 거두며 팬들의 박수를 받았습니다. 도심 교통 소식입니다. 주요 간선도로의 차로 정비가 순차적으로
      진행되면서 출퇴근 시간대에는 일부 구간에서 서행이 예상됩니다. 한편, 지역 철도역과 버스 환승센터의 안내 표지 개선 작업이 마무리돼 이용객
      동선이 한층 편리해졌습니다. 생활 정보입니다. 전통시장과 골목상권에서는 신선식품 할인 행사와 야간 연장 운영이 이어져 시민들의 발걸음을
      모으고 있습니다. 문화계에서는 지역 미술관의 기획전과 시민회관의 실내 악단 연주회가 이번 주 관람객을 맞이할 예정입니다. 교육 현장에서는
      공공도서관의 주말 독서 프로그램과 가족 체험 강좌가 꾸준한 호응을 얻고 있습니다. 오늘의 날씨와 생활 정보는 잠시 뒤 다시 전해드리겠습니다.
      지금까지 저녁 종합 뉴스였습니다. 시청해 주신 여러분, 고맙습니다.
