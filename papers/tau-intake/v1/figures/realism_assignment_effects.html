<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 620px 384px; margin: 0; }
  html, body { width: 620px; height: 384px; margin: 0; background: #fff; }
  svg { display: block; width: 620px; height: 384px; font-family: "Times New Roman", Times, serif; }
  text { fill: #111; font-size: 23px; }
  .summary { font-weight: 700; }
  .grid { stroke: #dedede; stroke-width: 1; }
  .zero { stroke: #444; stroke-width: 2; }
  .agent-interval { stroke: #2b78b8; stroke-width: 3.5; }
  .scaffold-interval { stroke: #e87519; stroke-width: 3.5; stroke-dasharray: 8 5; }
  .cap { stroke-width: 2.5; stroke-dasharray: none; }
  .agent-marker { fill: #2b78b8; }
  .scaffold-marker { fill: #fff; stroke: #e87519; stroke-width: 3; }
  .axis { stroke: #555; stroke-width: 1.5; }
  .axis-title { font-size: 23px; }
  .value { fill: #111; }
</style>
</head>
<body>
<svg viewBox="0 0 620 384" role="img" aria-labelledby="title desc">
  <title id="title">Effect of assigning caller realisms by prompting arm</title>
  <desc id="desc">Horizontal forest plot comparing agent-directed and scaffolded percentage-point changes in exact task success. Every estimated 95 percent interval crosses zero.</desc>

  <g aria-label="Legend">
    <line class="agent-interval" x1="10" y1="17" x2="42" y2="17"/>
    <circle class="agent-marker" cx="26" cy="17" r="6"/>
    <text x="49" y="24">Agent-directed</text>
    <line class="scaffold-interval" x1="190" y1="17" x2="222" y2="17"/>
    <rect class="scaffold-marker" x="200" y="11" width="12" height="12"/>
    <text x="229" y="24">Scaffolded</text>
  </g>
  <text x="380" y="24" text-anchor="middle">hurts</text>
  <text x="490" y="24" text-anchor="middle">helps</text>

  <g aria-hidden="true">
    <line class="grid" x1="298" y1="34" x2="298" y2="310"/>
    <line class="grid" x1="353" y1="34" x2="353" y2="310"/>
    <line class="zero" x1="409" y1="34" x2="409" y2="310"/>
    <line class="grid" x1="465" y1="34" x2="465" y2="310"/>
    <line class="grid" x1="520" y1="34" x2="520" y2="310"/>

    <line class="axis" x1="298" y1="310" x2="298" y2="317"/>
    <line class="axis" x1="353" y1="310" x2="353" y2="317"/>
    <line class="axis" x1="409" y1="310" x2="409" y2="317"/>
    <line class="axis" x1="465" y1="310" x2="465" y2="317"/>
    <line class="axis" x1="520" y1="310" x2="520" y2="317"/>
    <text x="298" y="338" text-anchor="middle">-20</text>
    <text x="353" y="338" text-anchor="middle">-10</text>
    <text x="409" y="338" text-anchor="middle">0</text>
    <text x="465" y="338" text-anchor="middle">+10</text>
    <text x="520" y="338" text-anchor="middle">+20</text>
    <text class="axis-title" x="410" y="368" text-anchor="middle">Exact-success change (percentage points)</text>
  </g>

  <g aria-label="Any realism">
    <text class="summary" x="228" y="69" text-anchor="end">Any realism</text>

    <g aria-label="Agent-directed, -2.1 points, 95 percent interval -8.6 to +4.3">

      <line class="agent-interval cap" x1="432.9606323732476" y1="44" x2="432.9606323732476" y2="56"/>
      <circle class="agent-marker" cx="397.5038003025711" cy="50" r="6"/>
      <text class="value" x="440.9606323732476" y="57">-2.1</text>
    </g>

    <g aria-label="Scaffolded, -4.2 points, 95 percent interval -8.8 to +0.4">
      <line class="scaffold-interval" x1="359.9885392061825" y1="74" x2="411.2146829894508" y2="74"/>
      <line class="scaffold-interval cap" x1="359.9885392061825" y1="68" x2="359.9885392061825" y2="80"/>

      <text class="value" x="419.2146829894508" y="81">-4.2</text>
    </g>
  </g>
  <line x1="8" y1="89" x2="612" y2="89" stroke="#bbb" stroke-width="1.5"/>

    <text x="228" y="121" text-anchor="end">Wrong-field</text>

      <line class="agent-interval" x1="313.8572079181298" y1="102" x2="454.50808105266054" y2="102"/>
      <line class="agent-interval cap" x1="313.8572079181298" y1="96" x2="313.8572079181298" y2="108"/>
      <line class="agent-interval cap" x1="454.50808105266054" y1="96" x2="454.50808105266054" y2="108"/>
      <circle class="agent-marker" cx="389.7367659734317" cy="102" r="6"/>
      <text class="value" x="462.50808105266054" y="109">-3.5</text>
    </g>

    <g aria-label="Scaffolded, +1.7 points, 95 percent interval -10.2 to +12.6">
      <line class="scaffold-interval" x1="352.19390938338904" y1="126" x2="479.05210980583274" y2="126"/>
      <line class="scaffold-interval cap" x1="352.19390938338904" y1="120" x2="352.19390938338904" y2="132"/>
      <line class="scaffold-interval cap" x1="479.05210980583274" y1="120" x2="479.05210980583274" y2="132"/>
      <rect class="scaffold-marker" x="412.51411082025294" y="120" width="12" height="12"/>
      <text class="value" x="487.05210980583274" y="133">+1.7</text>
    </g>
  </g>

  <g aria-label="Spelling variation">
    <text x="228" y="173" text-anchor="end">Spelling variation</text>

    <g aria-label="Agent-directed, -6.2 points, 95 percent interval -17.3 to +4.7">
      <line class="agent-interval" x1="312.90588311903866" y1="154" x2="435.27971621595896" y2="154"/>
      <line class="agent-interval cap" x1="312.90588311903866" y1="148" x2="312.90588311903866" y2="160"/>
      <line class="agent-interval cap" x1="435.27971621595896" y1="148" x2="435.27971621595896" y2="160"/>

    </g>

    <g aria-label="Scaffolded, -7.2 points, 95 percent interval -15.1 to +0.5">
      <line class="scaffold-interval" x1="324.86475491707034" y1="178" x2="412.04665852032815" y2="178"/>
      <line class="scaffold-interval cap" x1="324.86475491707034" y1="172" x2="324.86475491707034" y2="184"/>

      <text class="value" x="420.04665852032815" y="185">-7.2</text>

      <line class="agent-interval" x1="332.46056930561997" y1="206" x2="455.41558046879084" y2="206"/>
      <line class="agent-interval cap" x1="332.46056930561997" y1="200" x2="332.46056930561997" y2="212"/>
      <line class="agent-interval cap" x1="455.41558046879084" y1="200" x2="455.41558046879084" y2="212"/>
      <circle class="agent-marker" cx="392.00480743182015" cy="206" r="6"/>
      <text class="value" x="463.41558046879084" y="213">-3.1</text>
    </g>

    <g aria-label="Scaffolded, -0.4 points, 95 percent interval -9.6 to +8.6">
      <line class="scaffold-interval" x1="355.6232522208575" y1="230" x2="456.7622891057163" y2="230"/>
      <line class="scaffold-interval cap" x1="355.6232522208575" y1="224" x2="355.6232522208575" y2="236"/>
      <line class="scaffold-interval cap" x1="456.7622891057163" y1="224" x2="456.7622891057163" y2="236"/>
      <rect class="scaffold-marker" x="400.9307774869197" y="224" width="12" height="12"/>
      <text class="value" x="464.7622891057163" y="237">-0.4</text>
    </g>
  </g>

  <g aria-label="Mispronunciation">
    <text x="228" y="277" text-anchor="end">Mispronunciation</text>

    <g aria-label="Agent-directed, -3.0 points, 95 percent interval -19.4 to +11.9">
      <line class="agent-interval" x1="301.1629137837339" y1="258" x2="475.01528720792936" y2="258"/>
      <line class="agent-interval cap" x1="301.1629137837339" y1="252" x2="301.1629137837339" y2="264"/>
      <line class="agent-interval cap" x1="475.01528720792936" y1="252" x2="475.01528720792936" y2="264"/>
      <circle class="agent-marker" cx="392.1159177071782" cy="258" r="6"/>
      <text class="value" x="483.01528720792936" y="265">-3.0</text>
    </g>

    <g aria-label="Scaffolded, +0.5 points, 95 percent interval -7.6 to +8.9">
      <line class="scaffold-interval" x1="366.5974183919057" y1="282" x2="458.7508005916676" y2="282"/>
      <line class="scaffold-interval cap" x1="366.5974183919057" y1="276" x2="366.5974183919057" y2="288"/>
      <line class="scaffold-interval cap" x1="458.7508005916676" y1="276" x2="458.7508005916676" y2="288"/>
