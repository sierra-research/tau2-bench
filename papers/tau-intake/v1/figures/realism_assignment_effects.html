<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 620px 295px; margin: 0; }
  html, body { width: 620px; height: 295px; margin: 0; background: #fff; }
  svg { display: block; width: 620px; height: 295px; font-family: Arial, Helvetica, sans-serif; }
  text { fill: #111; font-size: 23px; }
  .summary { font-weight: 700; }
  .grid { stroke: #dedede; stroke-width: 1; }
  .zero { stroke: #444; stroke-width: 2; }
  .interval { stroke: #2b78b8; stroke-width: 4; }
  .cap { stroke: #2b78b8; stroke-width: 2.5; }
  .point { fill: #2b78b8; }
  .axis { stroke: #555; stroke-width: 1.5; }
  .axis-title { font-size: 22.5px; }
  .value { paint-order: stroke; stroke: #fff; stroke-width: 6; stroke-linejoin: round; }
</style>
</head>
<body>
<svg viewBox="0 0 620 295" role="img" aria-labelledby="title desc">
  <title id="title">Effect of assigning caller realisms</title>
  <desc id="desc">Horizontal forest plot of percentage-point changes in exact task success. Every estimated 95 percent interval crosses zero.</desc>

  <text x="337" y="21" text-anchor="middle">hurts success</text>
  <text x="512" y="21" text-anchor="middle">helps success</text>

  <g aria-hidden="true">
    <line class="grid" x1="279" y1="27" x2="279" y2="235"/>
    <line class="grid" x1="357" y1="27" x2="357" y2="235"/>
    <line class="zero" x1="434" y1="27" x2="434" y2="235"/>
    <line class="grid" x1="512" y1="27" x2="512" y2="235"/>
    <line class="grid" x1="590" y1="27" x2="590" y2="235"/>
    <line class="axis" x1="240" y1="235" x2="590" y2="235"/>
    <line class="axis" x1="279" y1="235" x2="279" y2="242"/>
    <line class="axis" x1="357" y1="235" x2="357" y2="242"/>
    <line class="axis" x1="434" y1="235" x2="434" y2="242"/>
    <line class="axis" x1="512" y1="235" x2="512" y2="242"/>
    <line class="axis" x1="590" y1="235" x2="590" y2="242"/>
    <text x="279" y="264" text-anchor="middle">-20</text>
    <text x="357" y="264" text-anchor="middle">-10</text>
    <text x="434" y="264" text-anchor="middle">0</text>
    <text x="512" y="264" text-anchor="middle">+10</text>
    <text x="590" y="264" text-anchor="middle">+20</text>
    <text class="axis-title" x="390" y="289" text-anchor="middle">Exact-success change (percentage points)</text>
  </g>

  <g aria-label="Any caller realism, minus 3.6 points, 95 percent interval minus 10.4 to plus 3.0">
    <text class="summary" x="228" y="46" text-anchor="end">Any realism</text>
    <line class="interval" x1="353" y1="40" x2="457" y2="40"/>
    <line class="cap" x1="353" y1="32" x2="353" y2="48"/>
    <line class="cap" x1="457" y1="32" x2="457" y2="48"/>
    <polygon points="407,30 417,40 407,50 397,40" fill="#111"/>
    <text class="summary value" x="391" y="48" text-anchor="end">-3.6</text>
  </g>

  <line x1="8" y1="57" x2="612" y2="57" stroke="#bbb" stroke-width="1.5"/>

  <g aria-label="Wrong-field answer, minus 11.1 points, 95 percent interval minus 22.1 to plus 0.6">
    <text x="228" y="80" text-anchor="end">Wrong-field</text>
    <line class="interval" x1="261" y1="74" x2="439" y2="74"/>
    <line class="cap" x1="261" y1="66" x2="261" y2="82"/>
    <line class="cap" x1="439" y1="66" x2="439" y2="82"/>
    <circle class="point" cx="348" cy="74" r="7"/>
    <text class="value" x="360" y="82">-11.1</text>
  </g>

  <g aria-label="Spelling variation, minus 8.7 points, 95 percent interval minus 19.8 to plus 2.5">
    <text x="228" y="114" text-anchor="end">Spelling variation</text>
    <line class="interval" x1="280" y1="108" x2="454" y2="108"/>
    <line class="cap" x1="280" y1="100" x2="280" y2="116"/>
    <line class="cap" x1="454" y1="100" x2="454" y2="116"/>
    <circle class="point" cx="367" cy="108" r="7"/>
    <text class="value" x="379" y="116">-8.7</text>
  </g>

  <g aria-label="Self-correction, minus 4.3 points, 95 percent interval minus 14.3 to plus 6.6">
    <text x="228" y="148" text-anchor="end">Self-correction</text>
    <line class="interval" x1="322" y1="142" x2="486" y2="142"/>
    <line class="cap" x1="322" y1="134" x2="322" y2="150"/>
    <line class="cap" x1="486" y1="134" x2="486" y2="150"/>
    <circle class="point" cx="401" cy="142" r="7"/>
    <text class="value" x="413" y="150">-4.3</text>
  </g>

  <g aria-label="Mispronunciation, minus 0.5 points, 95 percent interval minus 19.5 to plus 15.0">
    <text x="228" y="182" text-anchor="end">Mispronunciation</text>
    <line class="interval" x1="282" y1="176" x2="551" y2="176"/>
    <line class="cap" x1="282" y1="168" x2="282" y2="184"/>
    <line class="cap" x1="551" y1="168" x2="551" y2="184"/>
    <circle class="point" cx="431" cy="176" r="7"/>
    <text class="value" x="443" y="184">-0.5</text>
  </g>

  <g aria-label="Falter and restart, plus 2.0 points, 95 percent interval minus 6.7 to plus 10.7">
    <text x="228" y="216" text-anchor="end">Falter/restart</text>
    <line class="interval" x1="382" y1="210" x2="518" y2="210"/>
    <line class="cap" x1="382" y1="202" x2="382" y2="218"/>
    <line class="cap" x1="518" y1="202" x2="518" y2="218"/>
    <circle class="point" cx="450" cy="210" r="7"/>
    <text class="value" x="462" y="218">+2.0</text>
  </g>

</svg>
</body>
</html>
