[pytest]
# Pytest configuration for tau2-bench

# Test markers
markers =
    unit: Fast unit tests with mocks (no real API calls)
    integration: Integration tests with real LLM API calls
    requires_nebius: Tests requiring NEBIUS_API_KEY environment variable
    requires_anthropic: Tests requiring ANTHROPIC_API_KEY environment variable
    slow: Tests that take more than 30 seconds
    e2e: End-to-end tests with full workflow
    a2a_mock: A2A tests with mocked dependencies (run by default)
    a2a_e2e: A2A end-to-end tests requiring real services (opt-in only)
    local_agent: Local A2A agent tests (requires NEBIUS_API_KEY and port 8001)
    smoke: Smoke tests for full tau2_agent <-> agent integration (opt-in, requires API keys)
    datadog_e2e: Datadog E2E observability tests (opt-in, runs real evaluations ~1-2min)

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
# Exclude slow opt-in tests by default (opt-in with -m "a2a_e2e" or -m "smoke" or -m "datadog_e2e")
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -m "not a2a_e2e and not smoke and not datadog_e2e"

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0
